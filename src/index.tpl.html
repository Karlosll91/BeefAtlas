<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas de la Res</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/*CSS*/
</style>
</head>
<body>
<div id="app" data-view="shop">
  <div id="stage">
    <div id="gl"></div>
    <div id="tags"></div>
    <div id="hover" hidden></div>
    <header id="brand"><span class="eyebrow">Carnicería</span><h1>Atlas de la Res</h1></header>
    <div id="cowtools" hidden><span>Separar cortes</span><input id="explode" type="range" min="0" max="100" value="0" aria-label="Separar cortes"></div>
    <nav id="views" aria-label="Vistas">
      <button data-v="shop" aria-pressed="true">Tienda</button><button data-v="cow" aria-pressed="false">La res</button><button data-v="case" aria-pressed="false">Vitrina</button><button data-v="block" aria-pressed="false">El corte</button>
    </nav>
    <div id="hint">Arrastra para girar · toca un corte</div>
    <div id="loading"><div class="box"><h2>Atlas de la Res</h2><div class="bar"><b></b></div><p id="loadmsg">Afilando los cuchillos…</p></div></div>
  </div>
  <aside id="panel">
    <div id="phead">
      <div class="who"><span class="ava"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 9.5a3 3 0 0 1 .6-5.9 4.4 4.4 0 0 1 8.8 0A3 3 0 0 1 17 9.5V12H7V9.5Z" fill="#F4F1E8"/><path d="M7.5 14.2c1 1.2 2.4 1.4 4.5.3 2.1 1.1 3.5.9 4.5-.3-.3 2.6-2 4.3-4.5 4.3s-4.2-1.7-4.5-4.3Z" fill="#EBDDB3"/></svg></span>
        <div style="min-width:0"><div class="nm">Don Rafa</div><div class="sub">Carnicero</div></div></div>
      <button class="pill" id="countryBtn" aria-haspopup="dialog"></button>
      <button class="pill" id="langBtn"></button>
      <button class="pill" id="gear" aria-label="Ajustes · Settings" aria-haspopup="dialog">⚙</button>
    </div>
    <div id="tabs" role="tablist"><button role="tab" aria-selected="true"></button><button role="tab" aria-selected="false"></button><button role="tab" aria-selected="false"></button><button role="tab" aria-selected="false"></button></div>
    <div id="pbody">
      <section class="sec" id="butchersec">
        <form class="ask" id="askform" autocomplete="off">
          <label class="lbl" id="askLabel" for="q"></label>
          <div class="askbox"><input id="q" type="search" enterkeyhint="search" autocomplete="off" aria-controls="sug"><button class="btn" id="go" type="submit"></button></div>
          <ul id="sug" hidden></ul>
        </form>
        <div id="answer"></div>
        <div><div class="lbl" id="orMethod" style="margin-bottom:7px"></div><div class="chips" id="methods"></div></div>
        <div><div class="lbl" id="exLabel" style="margin-bottom:7px"></div><div class="chips" id="examples"></div></div>
      </section>
      <section class="sec" id="cutsec" hidden><div id="cutcard"></div></section>
      <section class="sec" id="dishsec" hidden></section>
      <section class="sec" id="trsec" hidden></section>
    </div>
  </aside>
  <div id="settings" role="dialog" aria-label="Ajustes" hidden>
    <h3>Ajustes</h3>
    <div class="field"><span id="setLangL"></span><div class="seg" id="setLang"></div></div>
    <label class="field"><span id="setWhereL"></span><select id="setCountry"></select></label>
    <div class="field" id="voiceField" hidden><span id="setVoiceL"></span><div class="seg" id="setVoice"></div></div>
  </div>
</div>
<script type="text/plain" id="dishes">
/*DISHES*/
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*JS*/
</script>
</body>
</html>
