    mu: { d: 'A parte baixa do braço e da perna: o músculo com mais tendão e colágeno do boi. Em rodela com osso traz também o tutano.', tip: 'Em rodelas de 3–4 cm com osso para ossobuco; sem osso e inteiro para cozido.', cook: '2,5–3 horas em fogo baixo: não há atalho, salvo a panela de pressão.',
      why: { soup: 'Tendão, osso e tutano: é a peça que mais solta gelatina, e a que dá o caldo mais substancioso.', braise: 'Depois de três horas o tendão vira gelatina e o molho fica brilhante e grudento: ossobuco, jarret, chambarete.' } },
    bp: { d: 'O quadríceps: uma bola magra na parte dianteira da perna. Pouca gordura, fibra regular e sabor suave.', tip: 'Para bife ou milanesa, em fatias contra a fibra; para moer, dá uma carne bem magra.', cook: 'Em bife fino: um minuto de cada lado. Inteiro no forno: não mais de 57 °C.',
      why: { fry: 'Magro, sem nervos e fácil de fatiar por igual: fica macio à milanesa porque cozinha em dois minutos.', stirfry: 'Quase sem gordura nem tecido conjuntivo: em tiras finas cozinha na hora sem soltar água.' } },
    bo: { d: 'A parte de fora da perna. Magro e de fibra firme: endurece com calor seco e brilha no cozimento lento.', tip: 'Peça inteiro para carne de panela; em pedaços para ensopar.', cook: '2–2,5 horas na panela; fatiar contra a fibra.',
      why: { braise: 'Magro e firme, mantém a forma depois de horas de cozimento e fatia limpo: é a carne da posta sudada e do sauerbraten.', cure: 'Um músculo grande, magro e regular: seca de maneira uniforme. Daqui saem a cecina, o biltong e a carne de sol.' } },
    mc: { d: 'Um cilindro perfeito de carne magra na parte de trás da perna. Dos menos macios nas medições, mas regular e fácil de fatiar.', tip: 'Peça inteiro. Para rechear, que o açougueiro abra o túnel pelo centro.', cook: 'Em molho: 2 horas. Como rosbife: 52–55 °C e fatiado bem fino.',

    cp: { d: 'A face interna da perna: seu músculo maior e mais macio. Magro, de fibra fina e sem nervos.', tip: 'É a peça do bife do dia a dia e da milanesa: peça em bifes finos contra a fibra.', cook: 'Em bife: fogo alto, um minuto por lado. Inteiro: forno até 55 °C.',

    hi: { d: 'Macio, sem fibra e de sabor forte. Endurece e amarga em segundos se passar do ponto.', tip: 'Peça em bifes de 1 cm, sem a película. O de vitela é mais suave.', cook: 'Fogo alto, 1–2 minutos por lado: rosado no centro.',

    cz: { d: 'Um músculo puro, magro e denso, que trabalha sem parar. Sabor de carne concentrado; firme, mas macio se cortado fino.', tip: 'Peça limpo de gordura e veias, em cubos ou fatias.', cook: 'Marinado e em fogo muito alto por 2–3 minutos; ou ensopado 2 horas. O meio-termo fica duro.',

    chu: { d: 'O intestino delgado, trançado ou em espiral. Muita gordura: doura até ficar crocante por fora.', tip: 'Compre já lavado. Costuma-se ferver antes de fritar ou assar.', cook: 'Fervido 30 minutos e depois frito ou na brasa até dourar.',

      why: { grill: 'Dourada devagar na brasa com limão fica crocante por fora e cremosa por dentro: indispensável no asado argentino.' } },

  };
  const S = () => T[st.lang];
  const ICON = { done: '°C', shop: '☞', calc: '⚖', cmp: '⇄', gloss: 'Aa', quiz: '?', list: '★' };
  const ORDER = ['done', 'shop', 'calc', 'cmp', 'gloss', 'quiz', 'list'];
  const LOC = { es: 'es-CO', en: 'en-US', pt: 'pt-BR' };
  const lp = (c) => ctry(c || st.country).lang.slice(0, 2);
  const cl = (c) => ctry(c || st.country).lang;

  const nf = (x, d) => Number(x).toLocaleString(LOC[st.lang], { maximumFractionDigits: d == null ? 1 : d });
  const wt = (g) => (g >= 1000 ? nf(g / 1000, 2) + ' kg' : nf(g, 0) + ' g') + (st.lang === 'en' ? ` (${nf(g / 453.6, 1)} lb)` : '');
  const rnd = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[rnd(a.length)];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const on = (t) => st.tab === 4 && st.tool === t;
  const cutOpts = (sel) => A.cuts().map((c) => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${esc(cname(c))}</option>`).join('');
  const ctryOpts = (sel) => COUNTRIES.map((c) => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${esc(tx(c))}</option>`).join('');
  const topMethods = (cut) => Object.keys(cut.m).sort((a, b) => cut.m[b] - cut.m[a]);

  // ------------------------------------------------------------ state kept between visits

  const load = (k, d) => { try { const v = JSON.parse(ls.get(k)); return v == null ? d : v; } catch (e) { return d; } };
  const fav = { c: new Set(load('favc', []).filter((id) => BY[id])), d: new Set(load('favd', [])) };
  let list = load('list', []).filter((x) => x && BY[x.id]);
  const save = () => { ls.set('favc', JSON.stringify([...fav.c])); ls.set('favd', JSON.stringify([...fav.d])); ls.set('list', JSON.stringify(list)); };
  function addList(id, g, note) {
    const cur = list.find((x) => x.id === id && (x.note || '') === (note || '') && !x.done);
    if (cur) { if (g) cur.g = g; } else list.push({ id, g: g || 0, note: note || '', done: false });

  // ------------------------------------------------------------ doneness
  const LV = DONENESS.levels;
  const levelOf = (t) => { for (let i = 0; i < LV.length; i++) if (t <= LV[i].t[1]) return i; return LV.length - 1; };
  const mid = (i) => Math.round((LV[i].t[0] + LV[i].t[1]) / 2);
  const dname = (i, c) => DONENESS.names[c || st.country][i];
  const dfull = (i, c) => { const n = dname(i, c); return n[0] + (n[2] ? ', ' + n[2] : ''); };
  const orderPhrase = (i, c) => DONENESS.order[lp(c)].replace('{x}', dfull(i, c));
  const look = (t) => (typeof Shop !== 'undefined' && Shop.doneLook ? Shop.doneLook(t, st.sp) : { core: [198, 58, 69], band: 0.2, ring: [138, 111, 96], crust: [59, 33, 20], fat: [236, 214, 160] });
  function doneRec(cut) {
    const r = DONE_REC[cut.id] || {};
    const nm = (i) => `<b lang="${cl()}">${esc(lower(dname(i)[0]))}</b>`;
    let range = '';
    if (r.r) {
      const a = r.r[0], b = r.r[1], same = a === b || dname(a)[0] === dname(b)[0];
      range = (same ? esc(tx(DONE_NOTE.r1)).replace('{a}', nm(a)) : esc(tx(DONE_NOTE.r)).replace('{a}', nm(a)).replace('{b}', nm(b))) + ` (${LV[a].t[0]}–${LV[b].t[1]} °C)`;
    }
    if (r.pork) range += '. ' + esc(tx(DONE_NOTE.pork)).replace(/\.$/, '');
    if (r.r && r.slow) return { html: esc(tx(DONE_NOTE.both)).replace('{x}', range.charAt(0).toLowerCase() + range.slice(1)), lvl: r.r[0] };
    if (r.r) return { html: range + '.', lvl: r.r[0] };
    const k = r.slow ? 'slow' : r.safe ? 'safe' : r.crisp ? 'crisp' : r.soft ? 'soft' : null;
    return { html: k ? esc(tx(DONE_NOTE[k])) : '', lvl: null };
  }

  function rDone() {
    const s = S();
    $('#toolbody').innerHTML = `<p class="note">${esc(s.dnHint)}</p>${st.sp === 'pork' ? `<p class="whybox">${esc(tx(DONENESS.porkNote))}</p>` : ''}

      <p class="note">${esc(tx(DONENESS.safety))}</p>`;
    uDone();
  }
  function uDone() {
    if (!$('#dnSteak')) return;
    const s = S(), t = st.temp, i = levelOf(t), L = look(t), me = st.country, rgb = (a) => `rgb(${a.join(',')})`;
    const sk = $('#dnSteak'); sk.style.setProperty('--core', rgb(L.core)); sk.style.setProperty('--ring', rgb(L.ring)); sk.style.setProperty('--crust', rgb(L.crust)); sk.style.setProperty('--band', L.band.toFixed(3));
    sk.setAttribute('aria-label', tx(LV[i].d));
    const n = dname(i);
    $('#dnRead').innerHTML = `<div class="lbl">${esc(tx(ctry(me)))}</div><div class="big" lang="${cl()}">${esc(n[0])}</div>${n[2] || n[1] ? `<div class="also" lang="${cl()}">${esc([n[2], n[1]].filter(Boolean).join(' · '))}</div>` : ''}<div class="tnum">${t} °C · ${F(t)} °F</div>`;
    $('#dnChips').innerHTML = LV.map((l, k) => `<button class="chip" data-lvl="${k}" aria-pressed="${k === i}" lang="${cl()}">${esc(dname(k)[0])}<small>${l.t[0]}°</small></button>`).join('');
    $('#dnDesc').textContent = tx(LV[i].d);
    $('#dnPhrase').innerHTML = `<div class="lbl">${esc(s.dnHow.replace('{c}', tx(ctry(me))))}</div><div class="sayline" lang="${cl()}">«${esc(orderPhrase(i))}»</div>
      <div class="row">${A.canSay() ? `<button class="btn ghost" data-say="dn">▶ ${esc(s.listen)}</button>` : ''}<span class="note">${esc(s.waiter)}: <i lang="${cl()}">${esc(DONENESS.ask[lp()])}</i></span></div>`;
    $('#dnEach').innerHTML = COUNTRIES.map((c) => { const x = dname(i, c.id); return `<div class="r${c.id === me ? ' me' : ''}"><span class="cd">${c.id.toUpperCase()}</span><span class="ct">${esc(tx(c))}</span><span class="nm" lang="${c.lang}"><b>${esc(x[0])}</b>${x[1] || x[2] ? `<span>${esc([x[2], x[1]].filter(Boolean).join(' · '))}</span>` : ''}</span></div>`; }).join('');
    const cell = (k, c) => { const x = dname(k, c); return `<td lang="${cl(c)}"><b>${esc(x[0])}</b>${x[2] ? `<small>${esc(x[2])}</small>` : ''}</td>`; };
    $('#dnTable').innerHTML = LV.map((l, k) => `<tr data-lvl="${k}" class="${k === i ? 'me' : ''}"><td class="num">${l.t[0]}–${l.t[1]}</td>${cell(k, st.trFrom)}${cell(k, me)}</tr>`).join('');
    const cut = BY[st.sel], rec = cut && doneRec(cut);
    $('#dnCut').innerHTML = rec && rec.html ? `<h4>${esc(s.dnFor)} ${esc(lower(cname(cut)))}</h4><p class="whybox">${rec.html}</p>${rec.lvl != null ? `<div class="row" style="margin-top:8px"><button class="btn ghost" data-lvl="${rec.lvl}">${esc(s.dnSet)}</button></div>` : ''}` : '';
    const sh = A.shop(); if (sh && on('done')) { sh.setDoneness(t, st.sp); sh.setChalk(s.tools.done[0], [n[0], `${t} °C · ${F(t)} °F`]); }
  }

  // ------------------------------------------------------------ substitutes
  function subsOf(id) {
    const a = BY[id], co = {};
    DISHES.forEach((d) => { if (d.b === id) d.a.forEach((x) => { co[x] = (co[x] || 0) + 1; }); else if (d.a.includes(id)) co[d.b] = (co[d.b] || 0) + 1; });
    return CUTS.filter((c) => c.id !== id && c.sp === a.sp).map((c) => {
      const shared = topMethods(a).filter((m) => a.m[m] >= 2 && c.m[m] >= 2);
      const sim = 6 - (Math.abs(a.t - c.t) + Math.abs(a.f - c.f) + Math.abs(a.c - c.c));
      return { c, shared, s: Math.min(8, co[c.id] || 0) * 1.2 + sim * 1.3 + shared.length * 1.5 };
    }).filter((x) => x.shared.length).sort((x, y) => y.s - x.s || x.c.n - y.c.n).slice(0, 3);
  }
  function subsHtml(cut) {
    const s = S(), list = subsOf(cut.id); if (!list.length) return '';
    return `<div><h4>${esc(s.subs)}</h4><ul class="alts">${list.map((x, i) => `<li><button data-cut="${x.c.id}"><span class="rk">${i + 1}</span><span class="nm" lang="${cl()}">${esc(cname(x.c))}${x.c.price !== cut.price ? ` <span>· ${esc(x.c.price < cut.price ? s.cheaper : s.pricier)}</span>` : ''}</span><span class="wy">${esc(s.subWhy)} ${esc(x.shared.slice(0, 3).map((m) => lower(tx(METHODS[m].n))).join(', '))}.</span></button></li>`).join('')}</ul></div>`;
  }

  // ------------------------------------------------------------ pieces the cut card and the dish answer borrow
  function cutActions(cut) {
    const s = S(), f = fav.c.has(cut.id);
    return `<div class="row acts"><button class="btn ghost" data-fav="c:${cut.id}" aria-pressed="${f}">${f ? '★' : '☆'} ${esc(s.fav)}</button><button class="btn ghost" data-add="${cut.id}">+ ${esc(s.addL)}</button><button class="btn ghost" data-tool="shop">${esc(s.tools.shop[0])}</button><button class="btn ghost" data-share="c">${esc(s.share)}</button></div>`;
  }
  function cutSections(cut) {
    const s = S(), sh = A.shop(), rec = doneRec(cut), g = sh ? sh.grainOf(cut.id) : null;

  function findable() {

  function newQ() {
    const CUTS = A.cuts();
    const s = S(), kinds = ['name', 'name', 'method', 'done'], fd = findable(); if (fd.length > 4) kinds.push('find', 'find');
    const kind = pick(kinds);
    if (kind === 'find') { const c = pick(fd); return { kind, id: c.id, text: s.qzFind.replace('{x}', lower(cname(c))) }; }
    if (kind === 'name') {

        const others = shuffle(CUTS.filter((o) => o.id !== c.id && norm(o.names[x.id][0]) !== norm(c.names[x.id][0]))).slice(0, 3);
        const opts = shuffle([c].concat(others));

  if (COUNTRIES.some((c) => c.id === ls.get('country'))) st.country = ls.get('country');
  if (st.country === st.trFrom) st.trFrom = 'co';
  if (SPECIES[ls.get('sp')]) st.sp = ls.get('sp');
  st.saver = ls.get('saver') ? ls.get('saver') === '1' : !!(navigator.connection && navigator.connection.saveData);
  const cutsNow = () => CUTS.filter((c) => c.sp === st.sp);
  const L = () => STR[st.lang];
  const LI = { es: 0, en: 1, pt: 2 };
  const tx = (p) => !p ? '' : Array.isArray(p) ? (p[LI[st.lang]] || p[0] || '') : (p[st.lang] || p.es || '');
  const cname = (cut, c) => cut.names[c || st.country][0];
  const calt = (cut, c) => cut.names[c || st.country][1] || '';
  const ctry = (id) => COUNTRIES.find((c) => c.id === id);
  const cuisineName = (cc) => tx(CUISINE[cc] || [cc, cc]);
  const lower = (s) => s.charAt(0).toLowerCase() + s.slice(1);

  // ------------------------------------------------------------ search
  let INDEX = [];
  function buildIndex() {
    INDEX = [];
    CUTS.forEach((cut) => {
      const seen = new Set();
      COUNTRIES.forEach((c) => cut.names[c.id].forEach((nm, j) => nm.split(/·|\(|\)/).map((x) => x.trim()).filter((x) => x.length > 2 && !/^(solo|parte|zeb|con hueso|bone-in|avec)/i.test(x)).forEach((x) => {
        const k = norm(x); if (!k || seen.has(k + c.id)) return; seen.add(k + c.id);
        INDEX.push({ ty: 'cut', id: cut.id, t: x, s: tx(c) + (c.id !== st.country ? ' → ' + cname(cut) : ''), k, w: c.id === st.country ? 3 : 1 });
      })));
      cut.reg.forEach((r) => r[1].split(/·|\(|\)/).map((x) => x.trim()).filter((x) => x.length > 2).forEach((x) => INDEX.push({ ty: 'cut', id: cut.id, t: x, s: 'Colombia · ' + r[0] + ' → ' + cname(cut), k: norm(x), w: 1 })));
    });
    Object.keys(METHODS).forEach((m) => INDEX.push({ ty: 'method', id: m, t: tx(METHODS[m].n), s: L().bestFor + ' ' + tx(METHODS[m].v), k: norm(METHODS[m].n.join(' ') + ' ' + METHODS[m].v.join(' ') + ' ' + SYN[m]), w: 2 }));
    tools.index((e) => INDEX.push(e));
    DISHES.forEach((d) => INDEX.push({ ty: 'dish', id: d.i, t: d.n, s: cuisineName(d.cc) + ' · ' + tx(d.g), k: d.k, w: 2 + (d.cc === st.country.toUpperCase() ? 1 : 0) }));
  }
  function search(q, limit) {
    const nq = norm(q); if (!nq) return [];
    const toks = nq.split(' ');
    const out = [];
    for (const e of INDEX) {
      let sc = 0;
      if (e.k === nq) sc = 100; else if (e.k.startsWith(nq)) sc = 60; else if ((' ' + e.k).includes(' ' + nq)) sc = 45; else if (e.k.includes(nq)) sc = 30;
      else if (toks.length > 1 && toks.every((t) => e.k.includes(t))) sc = 22;
      if (!sc) continue;
      if (e.ty === 'method' && sc < 100) sc = Math.min(sc, 40);
      if (e.ty === 'term' && sc < 45) continue;
      out.push({ e, sc: sc + e.w * 2 - Math.min(10, e.k.length / 12) });
    }
    out.sort((a, b) => b.sc - a.sc);
    const seen = new Set(), res = [];
    for (const o of out) { const key = o.e.ty + o.e.id + (o.e.ty === 'cut' ? o.e.k : ''); if (seen.has(key)) continue; seen.add(key); res.push(o.e); if (res.length >= (limit || 8)) break; }
    return res;
  }

  // ------------------------------------------------------------ expert logic
  function generic(cut, m) {
    // fallback reason built from the cut's properties
    const es = [], en = [], pt = [];
    if (m === 'braise' || m === 'soup' || m === 'shred' || m === 'smoke') {
      if (cut.c >= 4) { es.push('tiene mucho colágeno que se vuelve gelatina con la cocción larga'); en.push('it has plenty of collagen that turns to gelatin with long cooking'); pt.push('tem muito colágeno que vira gelatina com o cozimento longo'); }
      else if (cut.c === 3) { es.push('tiene colágeno suficiente para quedar jugoso tras una cocción larga'); en.push('it has enough collagen to stay juicy through long cooking'); pt.push('tem colágeno suficiente para ficar suculento depois de um cozimento longo'); }
      else { es.push('es magro: queda bien si no se cocina de más'); en.push('it is lean: fine as long as it is not overcooked'); pt.push('é magro: fica bom se não cozinhar demais'); }
      if (cut.f >= 4) { es.push('y su grasa lo mantiene húmedo'); en.push('and its fat keeps it moist'); pt.push('e sua gordura o mantém úmido'); }
    } else {
      if (cut.t >= 4) { es.push('es de los cortes más tiernos'); en.push('it is among the most tender cuts'); pt.push('é dos cortes mais macios'); }
      else if (cut.t === 3) { es.push('es medianamente tierno, mejor cortado contra la fibra'); en.push('it is moderately tender, best sliced across the grain'); pt.push('é medianamente macio, melhor cortado contra a fibra'); }
      else { es.push('es firme: necesita corte fino o marinado'); en.push('it is firm: it needs thin slicing or a marinade'); pt.push('é firme: precisa de corte fino ou marinada'); }
      if (cut.f >= 4) { es.push('con buena grasa infiltrada'); en.push('with good marbling'); pt.push('com bom marmoreio'); } else if (cut.f <= 1) { es.push('y muy magro'); en.push('and very lean'); pt.push('e muito magro'); }
    }
    const s = ({ es, en, pt })[st.lang].join(' ');
    return s.charAt(0).toUpperCase() + s.slice(1) + '.';
  }
  const whyOf = (cut, m) => (cut.why && cut.why[m]) ? tx(cut.why[m]) : generic(cut, m);
  function rankMethod(m, budget) {
    const slow = /braise|shred|soup|smoke/.test(m), fast = /grill|sear|stirfry|raw|skewer|slice|roast/.test(m);
    const fit = (c) => m === 'grind' ? c.f * 0.9 + c.v * 0.5 : slow ? c.c * 1.0 + c.f * 0.45 + c.v * 0.2 : fast ? c.t * 1.0 + c.f * 0.4 + c.v * 0.3 : c.t * 0.6 + (6 - c.f) * 0.7;
    let list = cutsNow().filter((c) => c.m[m] >= 2).map((c) => ({ c, s: c.m[m] * 10 + (c.why && c.why[m] ? 3 : 0) + fit(c) + (budget === 1 ? (5 - c.price) * 2.5 : budget === 2 ? c.price * 2.5 : 0) }));
    if (budget === 1) list = list.filter((x) => x.c.price <= 2); if (budget === 2) list = list.filter((x) => x.c.price >= 3);
    return list.sort((a, b) => b.s - a.s || a.c.n - b.c.n).slice(0, 6).map((x) => x.c);
  }
  const dishesOf = (id) => DISHES.filter((d) => d.b === id).concat(DISHES.filter((d) => d.a.includes(id)));

  // ---- species: the shop sells one animal at a time; the other one's models load when first asked for

  function setSpecies(sp, quiet) {

    st.answer = exampleOf(sp); st.sel = st.last[sp] || st.answer.d.b; st.cutMethod = null;

  function go(e) {

  // ---- free-form questions answered by Claude (when the page is allowed to)
  let sample = null, tts = null, ctl = null;
  function catalog() {
    return cutsNow().map((c) => `${c.id}: ${cname(c)} (US: ${c.names.us[0]}) | tender ${c.t}/5 fat ${c.f}/5 collagen ${c.c}/5 price ${c.price}/4 | best: ${Object.keys(c.m).filter((m) => c.m[m] === 3).join(', ')}`).join('\n');
  }
  async function askClaude(q) {
    const S = L();
    st.answer = { type: 'ai', q, text: '', cuts: [], title: q.slice(0, 26), busy: true };
    setTab(0); renderButcher();
    if (!sample) { st.answer = { type: 'none', q, near: search(q.split(' ')[0], 5) }; renderButcher(); return; }
    if (ctl) ctl.abort(); ctl = new AbortController();
    const rules = `You are Don Rafa, a master butcher behind the counter of a neighbourhood shop. The customer shops in ${tx(ctry(st.country))}. Answer in ${({ es: 'Spanish', en: 'English', pt: 'Brazilian Portuguese' })[st.lang]}, warmly and concretely, in at most 110 words, plain text, no markdown, no lists.\n` +
      `Recommend only ${st.sp} cuts from this catalogue, and call them by the name given here (the name used where the customer shops). Explain WHY the cut suits the preparation using its tenderness, fat, collagen and grain, and give one practical tip (thickness, doneness temperature in °C, or how to ask for it).\n` +
      `If the question is not about meat, cooking or buying meat, say briefly that you only know about meat.\n` +
      `Your reply MUST start with one line exactly like "CUTS: id1,id2" listing 1 to 3 catalogue ids, best first (or "CUTS:" alone if none apply). Then a blank line, then the answer.\n\nCATALOGUE (id: name | properties | best methods)\n${catalog()}`;
    try {
      if (shop) shop.talk(6000);

        const m = text.match(/^\s*CUTS:\s*([a-z, ]*)\n?/i);
        let body = text, ids = [];
        if (m) { ids = m[1].split(',').map((x) => x.trim()).filter((x) => BY[x]); body = text.slice(m[0].length); }
        else if (/^\s*C(U(T(S)?)?)?:?\s*$/i.test(text) || /^\s*CUTS:[^\n]*$/i.test(text)) body = '';
        st.answer.text = body.trim(); st.answer.cuts = ids.slice(0, 3);
        const out = $('#aitext'); if (out) { out.textContent = st.answer.text; out.classList.toggle('thinking', !st.answer.text); if (!st.answer.text) out.textContent = S.thinking; }
      };
      const res = await sample([{ role: 'user', content: rules }, { role: 'user', content: q }], { modelTier: 'quick', signal: ctl.signal, cache: false, onText: ({ text }) => apply(text) });
      apply(res.text);

      if (off) sample = null;

  const tyLabel = (e) => e.lbl || (e.ty === 'dish' ? L().dish : e.ty === 'cut' ? L().cut : L().method);
  function ttsBtn() { return tts ? `<button class="btn ghost" id="speak">${esc(L().speak)}</button>` : ''; }
  function answerText() {
    const a = st.answer; if (!a) return '';

  const PACKS = {"beef": {"url": "meshes.pack?v=32b29128ed", "bytes": 1417019}, "pork": {"url": "meshes_pork.pack?v=5faaec7b4a", "bytes": 921756}};
  const PCACHE = 'korte-packs';
  const mb = (n) => (n / 1048576).toLocaleString(st.lang === 'en' ? 'en' : 'es', { maximumFractionDigits: 1 }) + ' MB';
  async function cachedPack(sp) { try { return window.caches ? (await (await caches.open(PCACHE)).match(PACKS[sp].url)) || null : null; } catch (e) { return null; } }
  async function prunePacks() {
    const c = await caches.open(PCACHE), keep = Object.values(PACKS).map((p) => new URL(p.url, location.href).href);
    for (const k of await c.keys()) if (!keep.includes(k.url)) await c.delete(k);
  }
  async function fetchPack(sp, onProgress) {
    const P = PACKS[sp];
    let r = await cachedPack(sp);
    if (!r) {
      r = await fetch(P.url); if (!r.ok) throw new Error('http ' + r.status);
      if (window.caches) { const copy = r.clone(); caches.open(PCACHE).then((c) => c.put(P.url, copy)).then(prunePacks).catch(() => { }); }
    }
    let gz;
    if (r.body && r.body.getReader) {
      const rd = r.body.getReader(), chunks = []; let n = 0;
      for (;;) { const { done, value } = await rd.read(); if (done) break; chunks.push(value); n += value.length; if (onProgress) onProgress(Math.min(1, n / P.bytes)); }
      gz = new Uint8Array(n); let o = 0; for (const c of chunks) { gz.set(c, o); o += c.length; }
    } else gz = new Uint8Array(await r.arrayBuffer());
    if (gz[0] !== 0x1f || gz[1] !== 0x8b) return gz.buffer;                 // already inflated by the server
    if (!window.DecompressionStream) throw new Error('no DecompressionStream');
    return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  }
  // with data saver on, nothing heavy downloads until the person asks for it
  function askLoad(sp) {
    return new Promise((ok) => {
      const box = $('#loading'), btn = $('#loadBtn');
      box.classList.remove('done'); $('#loading .bar').hidden = true; $('#loadmsg').textContent = L().saverMsg;
      btn.hidden = false; btn.textContent = `${L().load3d} · ${tx(SPECIES[sp].n)} · ${mb(PACKS[sp].bytes)}`;
      btn.onclick = () => { btn.hidden = true; $('#loading .bar').hidden = false; $('#loadmsg').textContent = L().loading; ok(); };
    });
  }
  async function gate(sp) { if (st.saver && !(await cachedPack(sp))) { await askLoad(sp); return true; } return false; }
  async function renderOffline() {
    const S = L(), box = $('#setOffline'); if (!box) return;
    const rows = await Promise.all(Object.keys(PACKS).map(async (sp) => `<div class="offrow"><b>${esc(tx(SPECIES[sp].n))}</b>${(await cachedPack(sp)) ? `<span class="note">✓ ${esc(S.saved)}</span>` : `<button class="btn ghost" data-save="${sp}">${esc(S.download)} · ${mb(PACKS[sp].bytes)}</button>`}</div>`));
    box.innerHTML = rows.join('');
  }
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; renderStatic(); });
  window.addEventListener('appinstalled', () => { installEvt = null; renderStatic(); });
  const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function load3D() {
    const bar = $('#loading .bar b'), fail = () => { $('#loadmsg').textContent = L().loadFail; $('#loading .bar').hidden = true; setTimeout(() => $('#loading').classList.add('done'), 2600); };
    if (!window.THREE) return fail();
    gate('beef').then(() => fetchPack('beef', (k) => { bar.style.width = Math.min(96, 4 + 92 * k) + '%'; })).then((buf) => {
      const pack = MeshLib.parsePack(buf);
      const wide = () => window.matchMedia('(min-width: 881px)').matches;
      shop = Shop.create($('#gl'), pack, { cuts: CUTS, panelWidth: () => wide() ? $('#panel').offsetWidth + 14 : 0, onFrame: drawTags });
      shop.onPick = (h) => { if (tools.pickCow(h)) return; if (!h || !h.cut) return; if (h.where === 'case') selectCut(h.cut, { view: 'block', keepAnswer: true }); else if (h.where === 'block') setTab(1); else selectCut(h.cut, { keepAnswer: true }); };
      shop.onHover = (h, e) => { const el = $('#hover'), scn = tools.scene(); if (!h || !h.cut || (scn && scn.quiet)) { el.hidden = true; return; } const r = $('#stage').getBoundingClientRect(); el.hidden = false; el.textContent = cname(BY[h.cut]); el.style.left = (e.clientX - r.left) + 'px'; el.style.top = (e.clientY - r.top) + 'px'; };
      shop.setTags((c) => cname(c));
      if (st.sp !== 'beef') { shop.setSpecies(st.sp); ensurePack(st.sp); }
      setView(st.view); sync3D();
      const done = () => { $('#loading').classList.add('done'); shop.setPose('wave', 2200); shop.dirty(); };
      (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { shop.setTags((c) => cname(c)); sync3D(); setTimeout(done, 350); });
      window.__shop = shop; renderOffline();
    }).catch((err) => { console.error(err); fail(); });
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
