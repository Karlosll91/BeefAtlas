<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16382d">
<meta name="description" content="Cortes de res y cerdo: qué pedir, por qué y cómo se llama en cada país.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Korte">
<title>Korte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: the shop fills the screen; an order-pad panel sits to the right (below on phones). */
:root {
  --paper: #F5ECDC; --paper-2: #EBDFC9; --ink: #1B1A17; --muted: #5E6B63; --line: #CFC3AE;
  --green: #16382D; --crimson: #B93526; --crimson-ink: #FFFFFF; --brass: #9A6F17; --gold: #E8C37A; --gold-ink: #2B1E00;
  --shadow: 0 18px 50px rgba(10, 16, 12, 0.35);
  --display: "Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px; --panel-w: 420px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121B17; --paper-2: #1A2520; --ink: #E7ECE6; --muted: #93A199; --line: #2C3A33;
  --green: #8FCFB5; --crimson: #E0533F; --crimson-ink: #1B0609; --brass: #D9A94A; --gold: #E8C37A; --gold-ink: #2B1E00; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121B17; --paper-2: #1A2520; --ink: #E7ECE6; --muted: #93A199; --line: #2C3A33;
  --green: #8FCFB5; --crimson: #E0533F; --crimson-ink: #1B0609; --brass: #D9A94A; --gold: #E8C37A; --gold-ink: #2B1E00; color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100%; margin: 0 }
body { background: #2a2420; color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; overflow: hidden }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; border-radius: 6px }
[hidden] { display: none !important }

#app { position: relative; height: 100%; display: flex; flex-direction: column }
#stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: #2a2420 }
#gl, #gl canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
#gl canvas { cursor: grab } #gl canvas:active { cursor: grabbing }
#stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 45% 45%, transparent 55%, rgba(20, 12, 6, 0.38) 100%) }

/* brand plate */
#brand { position: absolute; left: 16px; top: 14px; z-index: 3; display: flex; flex-direction: column; gap: 0; padding: 9px 16px 10px; background: #16382d; color: #F5ECDC; border: 2px solid #E8C37A; border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35) }
#brand .eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.85 }
#brand h1 { font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1.05; margin: 0; letter-spacing: 0.01em }

/* species switch */
#species { position: absolute; left: 16px; top: 86px; z-index: 3; background: rgba(18, 27, 23, 0.82); border: 0; backdrop-filter: blur(6px) }
#species button { color: #E7ECE6; padding: 7px 16px }
#species button[aria-pressed="true"] { background: #E8C37A; color: #2B1E00 }

/* view switcher */
#views { position: absolute; left: 16px; bottom: 16px; z-index: 3; display: flex; gap: 4px; padding: 4px; background: rgba(18, 27, 23, 0.82); border-radius: 999px; backdrop-filter: blur(6px) }
#views button { border: 0; background: transparent; color: #E7ECE6; padding: 8px 15px; border-radius: 999px; font-weight: 600; font-size: 13.5px; white-space: nowrap }
#views button[aria-pressed="true"] { background: #E8C37A; color: #2B1E00 }
#cowtools { position: absolute; left: 16px; bottom: 68px; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: rgba(18, 27, 23, 0.82); color: #E7ECE6; border-radius: 999px; font-size: 13px; font-weight: 600; backdrop-filter: blur(6px) }
#cowtools input { width: 150px; accent-color: #E8C37A }
#hint { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 2; color: rgba(255, 255, 255, 0.85); font-size: 12.5px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7); pointer-events: none; white-space: nowrap }

/* labels over the 3D scene */
#tags { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden }
.tag { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px; border-radius: 999px; background: #17261F; color: #fff; font-weight: 700; font-size: 13px; white-space: nowrap; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4); will-change: transform }
.tag i { font-style: normal; font-family: var(--mono); font-size: 11.5px; width: 21px; height: 21px; display: grid; place-items: center; border-radius: 50%; background: #E8C37A; color: #2B1E00 }
.tag.alt { background: rgba(23, 38, 31, 0.86); font-weight: 600; font-size: 12px }
.tag.alt i { background: #E7ECE6; color: #17261F }
#hover { position: absolute; z-index: 4; pointer-events: none; padding: 4px 9px; border-radius: 6px; background: rgba(23, 38, 31, 0.92); color: #fff; font-size: 12.5px; font-weight: 600; transform: translate(12px, 14px); white-space: nowrap }

/* loading */
#loading { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: #16382d; color: #F5ECDC; text-align: center; padding: 24px; transition: opacity 0.5s }
#loading.done { opacity: 0; pointer-events: none }
#loading .box { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 320px }
#loading h2 { font-family: var(--display); font-size: 26px; margin: 0 }
#loading .bar { width: 220px; height: 6px; border-radius: 3px; background: rgba(235, 221, 179, 0.2); overflow: hidden }
#loading .bar b { display: block; height: 100%; width: 4%; background: #E8C37A; transition: width 0.2s }
#loading p { margin: 0; font-size: 13.5px; opacity: 0.85 }
#loading .btn { padding: 0 18px; background: #E8C37A; color: #2B1E00 }
.offrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 14px }
.offrow .btn.ghost { min-height: 32px; font-size: 12.5px; padding: 0 10px }
#settings { max-height: calc(100% - 80px); overflow-y: auto }

/* panel */
#panel { position: absolute; z-index: 5; right: 14px; top: 14px; bottom: 14px; width: var(--panel-w); display: flex; flex-direction: column; background: var(--paper); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--line) }
#phead { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line) }
#phead .who { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1 }
#phead .ava { width: 34px; height: 34px; border-radius: 50%; background: var(--green); display: grid; place-items: center; flex: 0 0 auto }
#phead .ava svg { width: 24px; height: 24px }
#phead .nm { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.1 }
#phead .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper-2); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 600; white-space: nowrap }
.pill:hover { border-color: var(--ink) }
.pill .code { font-family: var(--mono); font-size: 11px; color: var(--crimson) }
#tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); background: var(--paper-2) }
#tabs button { border: 0; background: transparent; padding: 10px 2px 9px; font-weight: 600; font-size: 13px; color: var(--muted); border-bottom: 3px solid transparent; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
#tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--crimson); background: var(--paper) }
#pbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin }
.sec { padding: 14px 14px 22px; display: flex; flex-direction: column; gap: 14px }

/* settings popover */
#settings { position: absolute; z-index: 8; right: 26px; top: 62px; width: 300px; max-width: calc(100% - 32px); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px }
#settings h3 { margin: 0; font-family: var(--display); font-size: 18px }
.field { display: flex; flex-direction: column; gap: 5px }
.field > span, .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted) }
.seg { display: inline-flex; background: var(--paper-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; align-self: flex-start }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13.5px }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper) }
select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); max-width: 100% }

/* ask box */
.ask { position: relative; display: flex; flex-direction: column; gap: 6px }
.askbox { display: flex; gap: 6px }
.askbox input { flex: 1; min-width: 0; padding: 12px 13px; font-size: 16px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--paper) }
.askbox input:focus { outline: none; border-color: var(--crimson) }
.btn { border: 0; background: var(--crimson); color: var(--crimson-ink); padding: 0 16px; border-radius: var(--r); font-weight: 700; min-height: 44px }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); min-height: 38px; padding: 0 13px; font-weight: 600; font-size: 13.5px }
.btn.ghost:hover { border-color: var(--ink) }
#sug { list-style: none; margin: 0; padding: 5px; position: absolute; left: 0; right: 0; top: 100%; z-index: 7; background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 1px; max-height: 330px; overflow-y: auto }
#sug button { width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 7px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 2px 8px; align-items: baseline }
#sug button:hover, #sug button.on { background: var(--paper-2) }
#sug .ty { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--crimson) }
#sug .tt { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
#sug .ss { grid-column: 2; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

/* answers */
.ans { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 12px; background: var(--paper-2); border: 1px solid var(--line) }
.ans .tagline { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center }
.ans .tagline b { color: var(--crimson); font-weight: 600 }
.ans h2 { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.12; margin: 0; text-wrap: balance }
.ans h2 em { font-style: normal; color: var(--crimson) }
.ans p { margin: 0 }
.ans h4, .card h4 { margin: 0 0 5px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.ticket { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; border: 2px solid var(--crimson); background: var(--paper); border-radius: 9px; padding: 9px 12px }
.ticket .n { font-family: var(--mono); font-weight: 600; font-size: 13px; color: var(--crimson); flex: 0 0 auto }
.ticket .t { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.1; min-width: 0 }
.ticket .t small { display: block; font-family: var(--body); font-weight: 400; font-size: 12.5px; color: var(--muted); margin-top: 2px }
.ticket .go { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap }
.alts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px }
.alts button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 8px 11px; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 1px 9px; align-items: baseline }
.alts button:hover { border-color: var(--ink) }
.alts .rk { font-family: var(--mono); font-size: 12px; font-weight: 600; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); border: 1px solid var(--line); grid-row: span 2; align-self: start }
.alts li:first-child .rk.top { background: var(--gold); color: var(--gold-ink); border-color: var(--gold) }
.alts .nm { font-weight: 700 }
.alts .nm span { font-weight: 400; color: var(--muted); font-size: 12.5px }
.alts .wy { grid-column: 2; font-size: 13.5px; color: var(--muted) }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600 }
.chip:hover { border-color: var(--ink) }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.chip small { font-weight: 400; color: var(--muted); margin-left: 4px }
.note { font-size: 13px; color: var(--muted) }
.thinking::after { content: "…"; animation: dots 1.2s steps(4) infinite }
@keyframes dots { 0% { opacity: 0.2 } 50% { opacity: 1 } 100% { opacity: 0.2 } }
h3.h { margin: 4px 0 0; font-family: var(--display); font-size: 18px; font-weight: 700 }

/* cut card */
.card { display: flex; flex-direction: column; gap: 15px }
.card .meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted) }
.card h2 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 6vw, 34px); line-height: 1.03; margin: 3px 0 0; text-wrap: balance }
.card .also { color: var(--muted); font-size: 14px; margin-top: 3px }
.card p { margin: 0; max-width: 62ch }
.bars { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; align-items: center; font-size: 13.5px }
.bars .b { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px }
.bars .b i { height: 9px; border-radius: 2px; background: var(--line) }
.bars .b i.on { background: var(--crimson) }
.names { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.names .r { display: grid; grid-template-columns: 34px minmax(0, 0.8fr) minmax(0, 1.4fr); gap: 8px; padding: 7px 11px; align-items: baseline; font-size: 14px }
.names .r + .r { border-top: 1px dashed var(--line) }
.names .r.me { background: var(--paper-2) }
.names .cd { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--muted) }
.names .r.me .cd { color: var(--crimson) }
.names .ct { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.names .nm b { font-weight: 700 }
.names .nm span { display: block; color: var(--muted); font-size: 12.5px }
.regs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 14px }
.regs li { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 12px; padding-bottom: 5px; border-bottom: 1px dotted var(--line) }
.regs li span { color: var(--muted) }
.whybox { border-left: 3px solid var(--gold); padding: 2px 0 2px 11px; font-size: 14px }
.dishlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.dishlist button { width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 4px; border-bottom: 1px dashed var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; align-items: baseline }
.dishlist button:hover { background: var(--paper-2) }
.dishlist .dn { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.dishlist .dc { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap }
.dishlist .dg { grid-column: 1 / -1; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.dishlist .dk { color: var(--crimson); font-weight: 600 }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.filters input { grid-column: 1 / -1; padding: 10px 12px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--paper); font-size: 16px }
.tscroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r) }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { text-align: left; padding: 8px 10px; border-top: 1px dashed var(--line); vertical-align: top }
thead th { border-top: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper-2); position: sticky; top: 0 }
tbody tr { cursor: pointer } tbody tr:hover td { background: var(--paper-2) }
td small { display: block; color: var(--muted); font-size: 12px }
td.num { font-family: var(--mono); color: var(--muted); font-size: 12px; width: 30px }
.foot { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px }
.foot a { color: var(--ink) }

/* ---- tools ("More" tab) */
#toast { position: absolute; z-index: 9; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 9px 16px; border-radius: 999px; background: #17261F; color: #fff; font-weight: 600; font-size: 13.5px; box-shadow: var(--shadow); white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis }
.toolgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.tool { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 10px; align-items: start; min-height: 86px }
.tool:hover { border-color: var(--ink); background: var(--paper-2) }
.tool:first-child { grid-column: 1 / -1; border: 2px solid var(--crimson) }
.tool .ic { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: var(--paper); font-family: var(--display); font-weight: 700; font-size: 16px }
.tool .tt { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.15 }
.tool .ss { grid-column: 2; font-size: 12.5px; color: var(--muted); line-height: 1.35 }
.badge { font-style: normal; font-family: var(--mono); font-size: 11px; background: var(--gold); color: var(--gold-ink); border-radius: 999px; padding: 1px 7px; vertical-align: 2px }
.toolhead { display: flex; align-items: center; gap: 10px }
.toolhead h2 { font-family: var(--display); font-weight: 700; font-size: 23px; line-height: 1.1; margin: 0; min-width: 0 }
.toolbody { display: flex; flex-direction: column; gap: 14px }
.toolbody h4 { margin: 0 0 6px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.toolbody p { margin: 0 }
.acts .btn.ghost[aria-pressed="true"] { border-color: var(--brass); color: var(--brass) }
.btn.ghost[aria-pressed="true"] { border-color: var(--ink) }
.filters input[type="number"] { grid-column: auto; width: 100%; padding: 8px 10px; font-size: 15px }
.filters .field { min-width: 0 } .filters select { width: 100% }
input.wide { width: 100%; accent-color: var(--crimson); margin: 0; height: 28px }

/* doneness */
.donebox { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border-radius: 12px; background: var(--paper-2); border: 1px solid var(--line) }
.steakx { --core: #c63a45; --ring: #8a6f60; --crust: #3b2114; --band: 0.2; position: relative; height: 66px; border-radius: 20px 26px 26px 20px / 30px; background: var(--core); overflow: hidden;
  box-shadow: inset 0 0 0 4px var(--crust), inset 0 0 calc(var(--band) * 26px + 3px) calc(var(--band) * 27px + 5px) var(--ring), 0 3px 8px rgba(0, 0, 0, 0.25) }
.steakx i { position: absolute; right: 0; top: 0; bottom: 0; width: 13%; background: linear-gradient(90deg, rgba(236, 214, 160, 0), #ecd6a0 45%, #d9b871); box-shadow: inset -4px 0 0 var(--crust), inset 0 4px 0 var(--crust), inset 0 -4px 0 var(--crust) }
.dnread .big { font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1.08; text-wrap: balance }
.dnread .also { color: var(--muted); font-size: 13px; margin-top: 2px }
.dnread .tnum { font-family: var(--mono); font-size: 13px; margin-top: 6px; color: var(--crimson); font-weight: 600 }
.say { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--crimson); background: var(--paper) }
.sayline { font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.25 }
.acc { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.acc details + details { border-top: 1px dashed var(--line) }
.acc summary { cursor: pointer; padding: 9px 12px; font-weight: 700; font-size: 14.5px; list-style-position: outside; margin-left: 18px }
.acc summary small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px }
.acc details[open] { background: var(--paper-2) }
.acc details p { padding: 0 12px 11px 12px; font-size: 14px }
.acc details .row { padding: 0 12px 12px }
tr.me td { background: var(--paper-2) } tr.me td.num { color: var(--crimson); font-weight: 600 }
td.num { white-space: nowrap }

/* counter card */
.shopcard { display: flex; flex-direction: column; gap: 11px; padding: 16px; border-radius: 14px; background: var(--paper-2); border: 1px solid var(--line) }
.shopcard .huge { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 9vw, 46px); line-height: 1; text-wrap: balance }
.shopcard .also { color: var(--muted); font-size: 15px; margin-top: -6px }
.shopcard h4 { margin: 0 0 3px }

/* calculator */
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-2); padding: 3px; align-self: flex-start }
.stepper button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--paper); font-weight: 700; font-size: 17px; line-height: 1 }
.stepper b { min-width: 34px; text-align: center; font-family: var(--mono) }
.toolbody .seg button { padding: 6px 10px; font-size: 13px }

/* comparison */
.cmp { display: grid; grid-template-columns: minmax(0, 0.7fr) minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 13.5px }
.cmp > div { padding: 8px 9px; border-top: 1px dashed var(--line); min-width: 0 }
.cmp > div:nth-child(-n+3) { border-top: 0; background: var(--paper-2) }
.cmp .cl { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted) }
.cmp .ch { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 16px; line-height: 1.1 }
.cmp .ch i { font-style: normal; font-family: var(--mono); font-size: 11px; width: 20px; height: 20px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: var(--gold); color: var(--gold-ink) }
.cmp .b { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 5px } .cmp .b i { height: 9px; border-radius: 2px; background: var(--line) } .cmp .b i.on { background: var(--crimson) }
.cmp .btn.ghost { min-height: 32px; padding: 0 10px; font-size: 12.5px }

/* quiz */
.quiz button:disabled { cursor: default; opacity: 1 } .quiz button { align-items: center }
.quiz button.ok { border-color: #2f7d4f; background: rgba(47, 125, 79, 0.14) } .quiz button.ok .rk { background: #2f7d4f; color: #fff; border-color: #2f7d4f }
.quiz button.no { border-color: var(--crimson); background: rgba(163, 36, 47, 0.1) } .quiz button.no .rk { background: var(--crimson); color: var(--crimson-ink); border-color: var(--crimson) }
.quiz .rk { grid-row: auto }

/* shopping list */
.shoplist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.shoplist li { display: flex; align-items: center; gap: 4px; padding: 7px 0; border-bottom: 1px dashed var(--line) }
.shoplist label { display: flex; align-items: flex-start; gap: 9px; flex: 1; min-width: 0; cursor: pointer }
.shoplist input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--crimson); flex: 0 0 auto }
.shoplist small { display: block; color: var(--muted); font-size: 12.5px }
.shoplist li.done span { text-decoration: line-through; color: var(--muted) }
.mini { width: 32px; height: 32px; flex: 0 0 auto; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); font-size: 14px; line-height: 1 }
.mini:hover { border-color: var(--ink) }

@media (max-width: 880px) {
  #stage { flex: 0 0 43%; min-height: 250px }
  #panel { position: relative; right: auto; top: auto; bottom: auto; width: auto; flex: 1 1 auto; min-height: 0; border-radius: 14px 14px 0 0; margin-top: -12px; border: 0; border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.25) }
  #brand { left: max(10px, env(safe-area-inset-left, 0px)); top: 10px; padding: 6px 11px 7px } #brand h1 { font-size: 18px } #brand .eyebrow { font-size: 9px }
  #species { left: auto; right: 10px; top: 10px } #species button { padding: 6px 13px; font-size: 12.5px }
  #views { left: 10px; bottom: 22px } #views button { padding: 7px 11px; font-size: 12.5px }
  #cowtools { left: auto; right: 10px; bottom: 22px; padding: 6px 10px } #cowtools input { width: 84px } #cowtools span { display: none }
  #hint { display: none }
  #settings { right: 10px; top: auto; bottom: 10px; position: fixed }
  .sec { padding: 12px 16px 26px }
  #toast { position: fixed; bottom: 14px }
  #tabs button { font-size: 12.5px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }

<script>
// ---- mesh pack loader and materials (shared by the app and the test viewer)
const MeshLib = (function () {
  const T = window.THREE;

  function parsePack(buf) {
    const dv = new DataView(buf);
    const magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
    if (magic === 'CRN2') return parseCompact(buf);
    if (magic !== 'CARN') throw new Error('bad mesh pack');
    const hl = dv.getUint32(4, true);
    const head = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, hl)));
    const base = 8 + hl;
    const out = {};
    for (const m of head.meshes) {
      const q = new Uint16Array(buf, base + m.p, m.nv * 3);
      const pos = new Float32Array(m.nv * 3);
      const sx = (m.hi[0] - m.lo[0]) / 65535, sy = (m.hi[1] - m.lo[1]) / 65535, sz = (m.hi[2] - m.lo[2]) / 65535;
      for (let i = 0; i < m.nv; i++) {
        pos[3 * i] = m.lo[0] + q[3 * i] * sx;
        pos[3 * i + 1] = m.lo[1] + q[3 * i + 1] * sy;
        pos[3 * i + 2] = m.lo[2] + q[3 * i + 2] * sz;
      }
      const g = new T.BufferGeometry();
      g.setAttribute('position', new T.BufferAttribute(pos, 3));
      g.setAttribute('normal', new T.BufferAttribute(new Int8Array(buf, base + m.n, m.nv * 4), 4, true));
      const c = new Uint8Array(buf, base + m.c, m.nv * 4);
      g.setAttribute(m.kind === 'flesh' ? 'aux' : 'color', new T.BufferAttribute(c, 4, true));
      g.setIndex(new T.BufferAttribute(m.i16 ? new Uint16Array(buf, base + m.i, m.ni) : new Uint32Array(buf, base + m.i, m.ni), 1));
      g.computeBoundingSphere(); g.computeBoundingBox();
      out[m.name] = { geo: g, meta: m };
    }
    return { meshes: out, extra: head.extra, list: head.meshes };
  }

  // Compact pack (gen/packz.py): vertices in first-use order, indices as distance behind the newest vertex,
  // positions as zigzag deltas in byte planes, normals and colours as per-channel deltas.
  function parseCompact(buf) {
    const dv = new DataView(buf), hl = dv.getUint32(4, true);
    const head = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, hl)));
    const st = {}; let off = 8 + hl;
    for (const k of ['idx', 'plo', 'phi', 'nrm', 'col']) { st[k] = new Uint8Array(buf, off, head.streams[k]); off += head.streams[k]; }
    const at = { idx: 0, plo: 0, phi: 0, nrm: 0, col: 0 }, qmax = (1 << head.qb) - 1, out = {};
    for (const m of head.meshes) {
      const nv = m.nv, ni = m.ni;
      const idx = nv <= 65535 ? new Uint16Array(ni) : new Uint32Array(ni);
      let p = at.idx, next = 0; const si = st.idx;
      for (let k = 0; k < ni; k++) {
        let v = si[p++];
        if (v > 127) { const x = si[p++]; v = (v & 127) | ((x & 127) << 7); if (x > 127) v |= si[p++] << 14; }
        idx[k] = next - v; if (v === 0) next++;
      }
      at.idx = p;
      const pos = new Float32Array(nv * 3), nrm = new Int8Array(nv * 4), col = new Uint8Array(nv * 4);
      for (let c = 0; c < 3; c++) {
        const lo = st.plo, hi = st.phi, o = at.plo + c * nv, o2 = at.phi + c * nv, base = m.lo[c], sc = (m.hi[c] - m.lo[c]) / qmax;
        let acc = 0;
        for (let i = 0; i < nv; i++) { const z = lo[o + i] | (hi[o2 + i] << 8); acc += (z >>> 1) ^ -(z & 1); pos[3 * i + c] = base + acc * sc; }
        const on = at.nrm + c * nv; let an = 0;
        for (let i = 0; i < nv; i++) { an = (an + st.nrm[on + i]) & 255; nrm[4 * i + c] = an; }
      }
      for (let c = 0; c < 4; c++) { const oc = at.col + c * nv; let ac = 0; for (let i = 0; i < nv; i++) { ac = (ac + st.col[oc + i]) & 255; col[4 * i + c] = ac; } }
      at.plo += 3 * nv; at.phi += 3 * nv; at.nrm += 3 * nv; at.col += 4 * nv;
      const g = new T.BufferGeometry();
      g.setAttribute('position', new T.BufferAttribute(pos, 3));
      g.setAttribute('normal', new T.BufferAttribute(nrm, 4, true));
      g.setAttribute(m.kind === 'flesh' ? 'aux' : 'color', new T.BufferAttribute(col, 4, true));
      g.setIndex(new T.BufferAttribute(idx, 1));
      g.computeBoundingSphere(); g.computeBoundingBox();
      out[m.name] = { geo: g, meta: m };
    }
    return { meshes: out, extra: head.extra, list: head.meshes };
  }

  const NOISE = `
    float hash31(vec3 p){ p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }
    float vnoise(vec3 p){ vec3 i = floor(p); vec3 f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(mix(hash31(i), hash31(i+vec3(1,0,0)), f.x), mix(hash31(i+vec3(0,1,0)), hash31(i+vec3(1,1,0)), f.x), f.y),
                 mix(mix(hash31(i+vec3(0,0,1)), hash31(i+vec3(1,0,1)), f.x), mix(hash31(i+vec3(0,1,1)), hash31(i+vec3(1,1,1)), f.x), f.y), f.z); }
    float fbm3(vec3 p){ return 0.5*vnoise(p) + 0.3*vnoise(p*2.03+7.1) + 0.2*vnoise(p*4.1+3.3); }
  `;

  const lin = (c) => new T.Color(c).convertSRGBToLinear();

  // Meat material: fat rim, marbling, grain, muscle seams and bone from vertex fields + procedural noise.
  function fleshMaterial(o) {
    o = Object.assign({ meat: '#96242a', meat2: '#6a161c', fat: '#ead8ae', marb: 0.35, marbScale: 60, grain: 0.0, grainDir: [1, 0, 0], ribs: 0, seams: 0, seamScale: 5, seamCol: null, seamW: 0, marrow: 0.017, scale: 1, bone: 1, gloss: 0.45, rough: 0.46 }, o || {});
    const m = new T.MeshPhysicalMaterial({ color: 0xffffff, roughness: o.rough, metalness: 0.0, clearcoat: o.gloss * 0.7, clearcoatRoughness: 0.34 });
    m.envMapIntensity = 0.55;
    const U = {
      uMeat: { value: lin(o.meat) }, uMeat2: { value: lin(o.meat2) }, uFat: { value: lin(o.fat) },
      uMarb: { value: o.marb }, uMarbScale: { value: o.marbScale }, uGrain: { value: o.grain }, uGrainDir: { value: new T.Vector3().fromArray(o.grainDir).normalize() },
      uRibs: { value: o.ribs }, uSeams: { value: o.seams }, uSeamScale: { value: o.seamScale }, uSeamCol: { value: lin(o.seamCol || o.fat) }, uSeamW: { value: o.seamW }, uMarrow: { value: o.marrow }, uScale: { value: o.scale }, uBone: { value: o.bone }, uRough: { value: o.rough },
      uTint: { value: new T.Color(1, 1, 1) }, uGlow: { value: new T.Color(0, 0, 0) }, uFade: { value: 1 }
    };
    m.userData.U = U;
    m.onBeforeCompile = (sh) => {
      Object.assign(sh.uniforms, U);
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\nattribute vec4 aux;\nvarying vec3 vOP;\nvarying vec4 vAux;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvOP = position; vAux = aux;');
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', `#include <common>
          varying vec3 vOP; varying vec4 vAux;
          uniform vec3 uMeat, uMeat2, uFat, uGrainDir, uTint, uGlow, uSeamCol; uniform float uMarb, uMarbScale, uGrain, uRibs, uSeams, uSeamScale, uSeamW, uMarrow, uScale, uBone, uFade, uRough;
          float gRough;
          ${NOISE}
          vec3 hash33(vec3 p){ p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx); }
          float cellEdge(vec3 x){ vec3 ip = floor(x); vec3 fp = fract(x); float f1 = 8.0, f2 = 8.0;
            for (int k = -1; k <= 1; k++) for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
              vec3 g = vec3(float(i), float(j), float(k)); vec3 r = g + hash33(ip + g) - fp; float d = dot(r, r);
              if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) { f2 = d; } }
            return sqrt(f2) - sqrt(f1); }`)
        .replace('#include <color_fragment>', `
          vec3 p = vOP * uScale;
          vec3 pg = p - uGrainDir * dot(p, uGrainDir) * uGrain;
          float fatF = (vAux.x * 2.0 - 1.0) * 0.05;
          float boneF = (vAux.y * 2.0 - 1.0) * 0.05;
          float n1 = fbm3(pg * 46.0);
          float n2 = vnoise(p * 9.0 + 4.0);
          vec3 meat = mix(uMeat2, uMeat, smoothstep(0.2, 0.85, n1 * 0.65 + n2 * 0.5));
          // fibre streaks along the grain
          meat *= 0.80 + (0.26 * vnoise(pg * 150.0) + 0.14 * vnoise(pg * 420.0)) * step(0.05, uGrain) + 0.2 * (1.0 - step(0.05, uGrain));
          // marbling: fine flecks and short broken veins, stretched along the grain
          float S = uMarbScale;
          vec3 w = pg * S + 1.6 * vec3(vnoise(pg * S * 0.45), vnoise(pg * S * 0.45 + 11.0), vnoise(pg * S * 0.45 + 23.0));
          float vn = vnoise(w);
          float thick = (0.008 + 0.034 * uMarb) * (0.3 + 1.4 * vnoise(pg * S * 0.7 + 40.0));
          float vein = 1.0 - smoothstep(thick * 0.4, thick, abs(vn - 0.5));
          float vn2 = vnoise(w * 2.1 + 17.0);
          float vein2 = 1.0 - smoothstep(thick * 0.3, thick * 0.8, abs(vn2 - 0.5));
          float brk = smoothstep(0.36, 0.58, vnoise(w * 2.3 + 13.0));
          float gate = smoothstep(0.78 - 0.62 * uMarb, 0.98 - 0.5 * uMarb, vnoise(pg * S * 0.16 + 5.0) + 0.3 * vnoise(pg * S * 0.5 + 2.0));
          float fleck = smoothstep(0.84 - 0.1 * uMarb, 0.9 - 0.08 * uMarb, vnoise(pg * S * 3.1 + 9.0)) * uMarb;
          float marb = max(vein * brk, vein2 * brk * 0.75) * gate * step(0.001, uMarb);
          marb = max(marb, fleck * step(150.0, S));
          // seams between muscles: a drawn seam field on retail cuts, a cellular pattern on whole-animal faces
          float seamFat = 0.0;
          float seamF = (vAux.w * 2.0 - 1.0) * 0.05;
          if (uSeamW > 0.0) {
            float ww = uSeamW * (0.25 + 0.9 * vnoise(p * 42.0));
            seamFat = (1.0 - smoothstep(ww * 0.55, ww, abs(seamF + (vnoise(p * 60.0) - 0.5) * 0.006 + (vnoise(p * 21.0) - 0.5) * 0.008))) * smoothstep(0.25, 0.5, vnoise(p * 23.0 + 8.0) + 0.2) * 0.9;
          }
          float cellLine = 0.0;
          if (uSeams > 0.01) {
            vec3 q = p * uSeamScale + 0.9 * vec3(vnoise(p * 4.0), vnoise(p * 4.0 + 3.0), vnoise(p * 4.0 + 7.0));
            float e = cellEdge(q);
            cellLine = (1.0 - smoothstep(0.006, 0.02 + 0.03 * vnoise(p * 14.0), e)) * uSeams;
            if (uSeamScale < 20.0) cellLine *= smoothstep(0.35, 0.6, vnoise(p * 6.0 + 2.0));
          }
          float fat = 1.0 - smoothstep(-0.0012, 0.0012, fatF + (vnoise(p * 55.0) - 0.5) * 0.005);
          float line = 1.0 - smoothstep(0.0, 0.0018, abs(fatF + (vnoise(p * 55.0) - 0.5) * 0.005));

  // Soft studio environment for reflections (warm key panels, cool fill).
  function makeEnv(renderer) {
    const sc = new T.Scene();
    const sg = new T.SphereGeometry(20, 24, 12);
    const sc_ = new Float32Array(sg.attributes.position.count * 3);
    for (let i = 0; i < sg.attributes.position.count; i++) {
      const h = sg.attributes.position.getY(i) / 20, t = Math.min(1, Math.max(0, (h + 0.3) / 1.0));

    }
    sg.setAttribute('color', new T.BufferAttribute(sc_, 3));
    sc.add(new T.Mesh(sg, new T.MeshBasicMaterial({ side: T.BackSide, vertexColors: true })));
    const panel = (x, y, z, w, h, col, k) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(col).multiplyScalar(k), side: T.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); sc.add(m); };
    panel(0, 9, 2, 9, 5, '#fff3dd', 6);
    panel(-8, 4, 5, 5, 6, '#ffe9cc', 3);
    panel(8, 3, -4, 5, 5, '#dfeaff', 2);
    panel(2, 2, 10, 8, 3, '#ffffff', 1.5);
    const pm = new T.PMREMGenerator(renderer);
    const rt = pm.fromScene(sc, 0.03);
    pm.dispose();
    return rt.texture;
  }

  return { parsePack, fleshMaterial, clayMaterial, makeEnv, NOISE, lin };
})();

// ---- Glossary. g: group (meat, butcher, cook, grade, trap). cut: a cut that shows the idea.
const GLOSS_GROUPS = { meat: ['La carne', 'The meat', 'A carne'], butcher: ['En la carnicería', 'At the butcher’s', 'No açougue'], cook: ['En la cocina', 'In the kitchen', 'Na cozinha'], grade: ['Razas y calidades', 'Breeds and grades', 'Raças e classificações'], trap: ['Palabras trampa', 'Trap words', 'Palavras-armadilha'] };
const GLOSSARY = [
  { id: 'marbling', g: 'meat', cut: 'ba', t: ['Marmoleo', 'Marbling', 'Marmoreio'], aka: ['grasa infiltrada · veteado', 'intramuscular fat', 'gordura entremeada'],
    d: ['Las vetas finas de grasa dentro del músculo. Se funden al cocinar y dan jugo y sabor; es lo que más pesa en la calidad de un corte para parrilla.', 'The fine streaks of fat inside the muscle. They melt during cooking and give juice and flavour; it is what counts most in the quality of a grilling cut.', 'Os veios finos de gordura dentro do músculo. Derretem ao cozinhar e dão suculência e sabor; é o que mais pesa na qualidade de um corte para grelha.'] },
  { id: 'collagen', g: 'meat', cut: 'mu', t: ['Colágeno', 'Collagen', 'Colágeno'], aka: ['tejido conectivo', 'connective tissue', 'tecido conjuntivo'],
    d: ['La proteína que mantiene unidas las fibras. Abunda en los músculos que más trabajan. A fuego rápido queda dura; tras horas de calor húmedo se vuelve gelatina y deja la carne melosa.', 'The protein that holds the fibres together. Hard-working muscles have the most. Cooked fast it stays tough; after hours of moist heat it turns to gelatin and makes the meat silky.', 'A proteína que mantém as fibras unidas. Abunda nos músculos que mais trabalham. Em fogo rápido fica dura; depois de horas de calor úmido vira gelatina e deixa a carne macia e untuosa.'] },
  { id: 'grain', g: 'meat', cut: 'sb', t: ['Fibra', 'Grain', 'Fibra'], aka: ['hebra · veta', 'muscle fibres', 'sentido da fibra'],
    d: ['La dirección en que corren las fibras del músculo. Se ve como líneas paralelas en la superficie del corte.', 'The direction the muscle fibres run. You can see it as parallel lines on the surface of the cut.', 'A direção em que correm as fibras do músculo. Dá para ver como linhas paralelas na superfície do corte.'] },
  { id: 'against', g: 'cook', cut: 'en', t: ['A contrafibra', 'Against the grain', 'Contra a fibra'], aka: ['contra la veta · al través', 'across the grain', 'contra o fio'],
    d: ['Tajar en perpendicular a las fibras. Así cada bocado tiene fibras cortas y se siente tierno; a favor de la fibra, el mismo corte queda correoso. Es decisivo en sobrebarriga, vacío y entraña.', 'Slicing at right angles to the fibres. Every bite then has short fibres and feels tender; sliced with the grain the same cut is chewy. It is decisive for flank, bavette and skirt.', 'Fatiar perpendicular às fibras. Assim cada pedaço tem fibras curtas e fica macio; a favor da fibra, o mesmo corte fica borrachudo. É decisivo na fraldinha e na entranha.'] },
  { id: 'myoglobin', g: 'meat', t: ['Mioglobina', 'Myoglobin', 'Mioglobina'], aka: ['el «jugo rojo»', 'the “red juice”', 'o “suco vermelho”'],
    d: ['La proteína que le da el color rojo a la carne. El líquido rojo del plato es agua con mioglobina, no sangre. Con el calor pasa de rojo a rosado y luego a gris: eso es lo que muestra el término de cocción.', 'The protein that makes beef red. The red liquid on the plate is water with myoglobin, not blood. Heat turns it from red to pink to grey: that is what doneness shows.', 'A proteína que dá a cor vermelha à carne. O líquido vermelho do prato é água com mioglobina, não sangue. Com o calor passa de vermelho a rosado e depois a cinza: é isso que o ponto da carne mostra.'] },
  { id: 'fatcap', g: 'meat', cut: 'pa', t: ['Capa de grasa', 'Fat cap', 'Capa de gordura'], aka: ['grasa de cobertura', 'external fat', 'gordura de cobertura'],
    d: ['La grasa exterior que cubre algunos cortes. Protege la carne del fuego y la baña al fundirse. No dejes que te la quiten: se recorta después de cocinar.', 'The outer fat that covers some cuts. It shields the meat from the fire and bastes it as it melts. Do not let the butcher remove it: trim after cooking.', 'A gordura externa que cobre alguns cortes. Protege a carne do fogo e a rega ao derreter. Não deixe tirarem: apare depois de assar.'] },
  { id: 'silverskin', g: 'butcher', t: ['Tela', 'Silverskin', 'Membrana'], aka: ['pellejo · telilla · nervio', 'sinew · membrane', 'pele prateada · nervo'],
    d: ['La membrana plateada que envuelve algunos músculos. No se ablanda con ningún método: se quita con el cuchillo antes de cocinar. «Limpio» en la carnicería quiere decir sin telas.', 'The silvery membrane that wraps some muscles. No cooking method softens it: cut it off before cooking. “Trimmed” at the butcher’s means without it.', 'A membrana prateada que envolve alguns músculos. Não amolece com nenhum método: tira-se com a faca antes de cozinhar. “Limpo” no açougue quer dizer sem membranas.'] },
  { id: 'primal', g: 'butcher', t: ['Corte primario', 'Primal cut', 'Corte primário'], aka: ['pieza mayor', 'wholesale cut', 'peça inteira'],
    d: ['Las piezas grandes en que se divide la media canal (lomo, pierna, cuarto delantero…). De ellas salen los cortes que ves en la vitrina. Cada país traza las líneas en un sitio distinto: por eso las equivalencias nunca son exactas.', 'The large pieces a side of beef is first divided into (loin, round, chuck…). Retail cuts come from them. Every country draws the lines in a different place, which is why equivalents are never exact.', 'As peças grandes em que se divide a meia carcaça (lombo, traseiro, dianteiro…). Delas saem os cortes da vitrine. Cada país traça as linhas num lugar diferente: por isso as equivalências nunca são exatas.'] },
  { id: 'bonein', g: 'butcher', cut: 'tb', t: ['Con hueso', 'Bone-in', 'Com osso'], aka: ['', '', ''],
    d: ['El hueso frena la cocción junto a él y la carne pegada queda más jugosa. A cambio pagas peso que no te comes: calcula un 20–40 % más por persona.', 'The bone slows cooking next to it, so the meat against it stays juicier. In exchange you pay for weight you do not eat: allow 20–40% more per person.', 'O osso freia o cozimento junto dele e a carne colada fica mais suculenta. Em troca você paga peso que não come: calcule 20–40 % a mais por pessoa.'] },
  { id: 'butterfly', g: 'butcher', cut: 'mc', t: ['Abrir en libro', 'Butterfly', 'Abrir em manta'], aka: ['abrir en mariposa', 'open like a book', 'borboletear'],
    d: ['Cortar una pieza por la mitad sin separarla del todo, para abrirla como un libro. Queda más delgada y ancha: lista para rellenar, enrollar o asar más rápido.', 'Cutting a piece through the middle without separating it, so it opens like a book. It ends up thinner and wider: ready to stuff, roll or cook faster.', 'Cortar uma peça ao meio sem separá-la de todo, para abri-la como um livro. Fica mais fina e larga: pronta para rechear, enrolar ou assar mais rápido.'] },
  { id: 'tenderize', g: 'butcher', cut: 'cp', t: ['Tiernizar', 'Tenderize', 'Amaciar'], aka: ['aplanar · ablandar', 'pound', 'bater o bife'],
    d: ['Romper las fibras a golpes (mazo), con cuchillas o con un marinado ácido o enzimático (piña, papaya). Sirve para filetes delgados de pierna; no arregla un corte con mucho colágeno.', 'Breaking the fibres by pounding, with blades, or with an acidic or enzymatic marinade (pineapple, papaya). It helps thin leg steaks; it will not fix a collagen-heavy cut.', 'Romper as fibras batendo (martelo), com lâminas ou com uma marinada ácida ou enzimática (abacaxi, mamão). Serve para bifes finos do traseiro; não resolve um corte com muito colágeno.'] },
  { id: 'ratio', g: 'butcher', cut: 'mol', t: ['80/20', '80/20', '80/20'], aka: ['proporción carne/grasa', 'lean-to-fat ratio', 'proporção carne/gordura'],
    d: ['La proporción de carne magra y grasa en la carne molida. 80/20 es la clásica de hamburguesa; 90/10 sirve para salsas y rellenos, pero en hamburguesa queda seca.', 'The proportion of lean meat to fat in ground beef. 80/20 is the classic burger blend; 90/10 suits sauces and fillings but makes a dry burger.', 'A proporção de carne magra e gordura na carne moída. 80/20 é a clássica de hambúrguer; 90/10 serve para molhos e recheios, mas no hambúrguer fica seca.'] },
  { id: 'dryage', g: 'meat', cut: 'ba', t: ['Maduración en seco', 'Dry-aging', 'Maturação a seco'], aka: ['dry aged', 'dry-aged', 'dry aged'],
    d: ['La pieza reposa semanas en cámara fría, sin empaque. Pierde agua, las enzimas ablandan las fibras y aparece un sabor a nuez y queso. Merma mucho, por eso cuesta más.', 'The piece rests for weeks in a cold room, unwrapped. It loses water, enzymes soften the fibres and a nutty, cheesy flavour develops. The loss is large, hence the price.', 'A peça descansa semanas em câmara fria, sem embalagem. Perde água, as enzimas amaciam as fibras e surge um sabor de nozes e queijo. A perda é grande, por isso custa mais.'] },
  { id: 'wetage', g: 'meat', t: ['Maduración en húmedo', 'Wet-aging', 'Maturação úmida'], aka: ['madurada al vacío', 'vacuum-aged', 'maturada a vácuo'],
    d: ['La carne madura dentro de su empaque al vacío. Se ablanda igual, sin perder peso ni cambiar mucho de sabor. Es lo normal en la carne de supermercado.', 'The meat ages inside its vacuum pack. It tenderises just the same, without losing weight or changing much in flavour. It is the norm for supermarket beef.', 'A carne matura dentro da embalagem a vácuo. Amacia do mesmo jeito, sem perder peso nem mudar muito de sabor. É o normal na carne de supermercado.'] },
  { id: 'maillard', g: 'cook', t: ['Reacción de Maillard', 'Maillard reaction', 'Reação de Maillard'], aka: ['la costra · el dorado', 'browning', 'a crosta dourada'],
    d: ['La reacción entre proteínas y azúcares que forma la costra dorada y su sabor, por encima de unos 140 °C. Necesita superficie seca: por eso se seca la carne antes de ponerla al fuego.', 'The reaction between proteins and sugars that forms the brown crust and its flavour, above about 140 °C / 285 °F. It needs a dry surface, which is why you pat the meat dry first.', 'A reação entre proteínas e açúcares que forma a crosta dourada e seu sabor, acima de uns 140 °C. Precisa de superfície seca: por isso se seca a carne antes de levá-la ao fogo.'] },
  { id: 'sear', g: 'cook', t: ['Sellar', 'Sear', 'Selar'], aka: ['marcar · dorar', 'brown', 'dourar'],
    d: ['Dorar la superficie a fuego muy alto. Da sabor y costra; no «cierra los poros» ni retiene los jugos, eso es un mito.', 'Browning the surface over very high heat. It gives flavour and crust; it does not “seal in the juices” — that is a myth.', 'Dourar a superfície em fogo muito alto. Dá sabor e crosta; não “fecha os poros” nem segura os sucos, isso é mito.'] },
  { id: 'reverse', g: 'cook', cut: 'tb', t: ['Sellado inverso', 'Reverse sear', 'Selagem reversa'], aka: ['', '', ''],
    d: ['Para piezas de más de 4 cm: primero calor suave (horno o lado frío de la parrilla, 110–130 °C) hasta quedar 8–10 °C por debajo del término, y al final el sellado fuerte. Queda del mismo color de borde a borde.', 'For pieces thicker than 4 cm (1½ in): gentle heat first (oven or the cool side of the grill, 110–130 °C / 225–265 °F) until 8–10 °C below the target, then a hard sear. The colour is even from edge to edge.', 'Para peças com mais de 4 cm: primeiro calor suave (forno ou lado frio da grelha, 110–130 °C) até ficar 8–10 °C abaixo do ponto, e no fim a selagem forte. Fica da mesma cor de ponta a ponta.'] },
  { id: 'rest', g: 'cook', t: ['Reposo', 'Resting', 'Descanso'], aka: ['', '', ''],
    d: ['Dejar la carne quieta después del fuego: 5 minutos un filete, 15–20 una pieza grande. Los jugos se espesan y se quedan en la carne en vez de irse a la tabla.', 'Leaving the meat alone after cooking: 5 minutes for a steak, 15–20 for a roast. The juices thicken and stay in the meat instead of running onto the board.', 'Deixar a carne quieta depois do fogo: 5 minutos um bife, 15–20 uma peça grande. Os sucos engrossam e ficam na carne em vez de irem para a tábua.'] },
  { id: 'carryover', g: 'cook', t: ['Cocción residual', 'Carryover cooking', 'Cocção residual'], aka: ['', '', ''],
    d: ['La carne sigue subiendo de temperatura al sacarla del fuego: unos 3 °C un filete y hasta 8 °C una pieza grande. Por eso se retira antes de llegar al término.', 'Meat keeps heating after it leaves the fire: about 3 °C (5 °F) for a steak and up to 8 °C (15 °F) for a large roast. That is why you pull it before the target.', 'A carne continua esquentando ao sair do fogo: uns 3 °C um bife e até 8 °C uma peça grande. Por isso se tira antes de chegar ao ponto.'] },
  { id: 'lowslow', g: 'cook', cut: 'pe', t: ['Bajo y lento', 'Low and slow', 'Fogo baixo e lento'], aka: ['fuego lento', '', 'low and slow'],
    d: ['Cocinar a 110–135 °C durante muchas horas, con humo o sin él. Es la única forma de volver tiernos los cortes grandes con mucho colágeno y grasa.', 'Cooking at 110–135 °C (225–275 °F) for many hours, with or without smoke. It is the only way to make large, collagen-rich, fatty cuts tender.', 'Cozinhar a 110–135 °C por muitas horas, com ou sem fumaça. É o único jeito de deixar macios os cortes grandes com muito colágeno e gordura.'] },
  { id: 'sousvide', g: 'cook', t: ['Sous vide', 'Sous vide', 'Sous vide'], aka: ['cocción al vacío', 'water-bath cooking', 'cozimento a vácuo'],
    d: ['La carne va en bolsa al vacío dentro de un baño de agua a la temperatura exacta del término. No se puede pasar de punto; al final se sella en sartén para darle costra.', 'The meat goes in a vacuum bag into a water bath held at the exact target temperature. It cannot overcook; it gets a quick sear at the end for the crust.', 'A carne vai em saco a vácuo num banho de água na temperatura exata do ponto. Não tem como passar do ponto; no fim sela-se na frigideira para dar crosta.'] },
  { id: 'brine', g: 'cook', cut: 'pe', t: ['Salmuera', 'Brine', 'Salmoura'], aka: ['curar', 'cure', 'cura'],
    d: ['Agua con sal (y a veces azúcar y especias) donde la carne reposa horas o días. La sal entra, sazona por dentro y ayuda a retener agua. Con sal de cura es la base del corned beef y el pastrami.', 'Salted water (sometimes with sugar and spices) in which meat rests for hours or days. The salt works in, seasons the inside and helps hold water. With curing salt it is the base of corned beef and pastrami.', 'Água com sal (e às vezes açúcar e especiarias) onde a carne descansa horas ou dias. O sal entra, tempera por dentro e ajuda a reter água. Com sal de cura é a base do corned beef e do pastrami.'] },
  { id: 'steer', g: 'grade', t: ['Novillo, ternera, vaca', 'Steer, veal, cow', 'Novilho, vitela, vaca'], aka: ['', '', ''],
    d: ['Novillo: macho castrado joven, la carne estándar. Ternera: animal de menos de un año, carne pálida y suave (en España «ternera» es casi toda la carne de res joven). Vaca vieja: carne oscura, grasa amarilla y mucho sabor, muy apreciada en el norte de España.', 'Steer: a young castrated male, the standard beef. Veal: an animal under a year old, pale and mild (in Spain “ternera” covers most young beef). Old cow: dark meat, yellow fat and deep flavour, prized in northern Spain.', 'Novilho: macho castrado jovem, a carne padrão. Vitela: animal com menos de um ano, carne clara e suave (na Espanha “ternera” é quase toda a carne bovina jovem). Vaca velha: carne escura, gordura amarela e muito sabor, muito apreciada no norte da Espanha.'] },
  { id: 'zebu', g: 'grade', cut: 'mo', t: ['Cebú', 'Zebu', 'Zebu'], aka: ['Brahman · Nelore', 'Bos indicus', 'Nelore · Brahman'],
    d: ['El ganado de giba, adaptado al trópico: la mayoría de la res en Colombia, Brasil y Venezuela. Carne magra y de fibra firme, con menos marmoleo que las razas europeas. Solo él tiene morrillo (cupim).', 'Humped cattle adapted to the tropics: most of the beef in Colombia, Brazil and Venezuela. Lean, firm-grained meat with less marbling than European breeds. Only zebu has the hump cut (cupim).', 'O gado de cupim, adaptado aos trópicos: a maior parte do rebanho no Brasil, na Colômbia e na Venezuela. Carne magra e de fibra firme, com menos marmoreio que as raças europeias. Só ele tem cupim.'] },
  { id: 'angus', g: 'grade', t: ['Angus', 'Angus', 'Angus'], aka: ['Aberdeen Angus', 'Aberdeen Angus', 'Aberdeen Angus'],
    d: ['Raza británica que marmolea con facilidad. «Angus» en una etiqueta habla de la raza, no del grado de calidad: puede haber Angus corriente y Angus excelente.', 'A British breed that marbles easily. “Angus” on a label tells you the breed, not the quality grade: there is ordinary Angus and excellent Angus.', 'Raça britânica que marmoriza com facilidade. “Angus” no rótulo fala da raça, não da classificação de qualidade: há Angus comum e Angus excelente.'] },
  { id: 'wagyu', g: 'grade', t: ['Wagyu', 'Wagyu', 'Wagyu'], aka: ['Kobe · A5', 'Kobe · A5', 'Kobe · A5'],
    d: ['Razas japonesas con marmoleo extremo. En Japón se califica con letra (rendimiento, A–C) y número (calidad, 1–5): A5 es el máximo. Kobe es wagyu de una región concreta. Se sirve en porciones pequeñas: es muy graso.', 'Japanese breeds with extreme marbling. Japan grades it with a letter (yield, A–C) and a number (quality, 1–5): A5 is the top. Kobe is wagyu from one specific region. It is served in small portions: it is very rich.', 'Raças japonesas com marmoreio extremo. No Japão classifica-se com letra (rendimento, A–C) e número (qualidade, 1–5): A5 é o máximo. Kobe é wagyu de uma região específica. Serve-se em porções pequenas: é muito gorduroso.'] },
  { id: 'usda', g: 'grade', t: ['Prime, Choice, Select', 'Prime, Choice, Select', 'Prime, Choice, Select'], aka: ['grados USDA', 'USDA grades', 'classificação USDA'],
    d: ['Los grados de calidad de Estados Unidos, según el marmoleo y la edad del animal. Prime es el más marmoleado (restaurantes), Choice el intermedio y más común, Select el más magro.', 'The US quality grades, based on marbling and the animal’s age. Prime is the most marbled (steakhouses), Choice the common middle, Select the leanest.', 'As classificações de qualidade dos Estados Unidos, segundo o marmoreio e a idade do animal. Prime é a mais marmorizada (restaurantes), Choice a intermediária e mais comum, Select a mais magra.'] },
  { id: 'grass', g: 'grade', t: ['De pasto o de grano', 'Grass-fed or grain-fed', 'A pasto ou a grão'], aka: ['pastoreo · feedlot', 'pasture · feedlot', 'pasto · confinamento'],
    d: ['La res de pasto da carne más magra, de grasa amarillenta y sabor más intenso; es lo habitual en Colombia, Argentina, Uruguay y Brasil. La terminada con grano marmolea más y sabe más suave; es lo habitual en Estados Unidos.', 'Grass-fed cattle give leaner beef with yellowish fat and a stronger flavour; it is the norm in Colombia, Argentina, Uruguay and Brazil. Grain-finished beef marbles more and tastes milder; it is the norm in the US.', 'O boi de pasto dá carne mais magra, de gordura amarelada e sabor mais intenso; é o habitual no Brasil, na Argentina, no Uruguai e na Colômbia. O terminado a grão marmoriza mais e tem sabor mais suave; é o habitual nos Estados Unidos.'] },
  { id: 'churrasco', g: 'trap', t: ['Churrasco', 'Churrasco', 'Churrasco'], aka: ['', '', ''],
    d: ['En Brasil es el asado entero, la parrillada. En Argentina y Uruguay, un bife delgado a la plancha. En Colombia y Ecuador, un filete grueso a la parrilla (a menudo de lomo ancho) con chimichurri. En Chile, un sándwich de carne en láminas.', 'In Brazil it is the whole barbecue. In Argentina and Uruguay, a thin griddled steak. In Colombia and Ecuador, a thick grilled steak (often strip loin) with chimichurri. In Chile, a sandwich of thinly sliced beef.', 'No Brasil é o assado todo, a churrascada. Na Argentina e no Uruguai, um bife fino na chapa. Na Colômbia e no Equador, um bife grosso na grelha (muitas vezes de contrafilé) com chimichurri. No Chile, um sanduíche de carne em fatias.'] },
  { id: 'asado', g: 'trap', cut: 'cs', t: ['Asado', 'Asado', 'Asado'], aka: ['', '', ''],
    d: ['En casi todo el mundo hispano es carne a la parrilla. En Argentina y Uruguay es además un corte: el costillar («asado de tira»). Y en Venezuela el «asado negro» no va a la parrilla: es muchacho guisado en salsa oscura.', 'In most of the Spanish-speaking world it means grilled meat. In Argentina and Uruguay it is also a cut: the short ribs (“asado de tira”). And Venezuela’s “asado negro” never sees a grill: it is eye of round braised in a dark sauce.', 'Em quase todo o mundo hispânico é carne na grelha. Na Argentina e no Uruguai é também um corte: a costela (“asado de tira”). E na Venezuela o “asado negro” não vai à grelha: é lagarto cozido em molho escuro.'] },
  { id: 'lomo', g: 'trap', cut: 'lf', t: ['Lomo', 'Lomo', 'Lomo / Lombo'], aka: ['', '', ''],
    d: ['En Argentina «lomo» a secas es el lomo fino (tenderloin). En Colombia hay que decir cuál: lomo fino o lomo ancho. En España el «lomo» de vacuno es el lomo ancho, y el fino se llama solomillo. En Perú, el «lomo» del lomo saltado es lomo fino.', 'In Argentina plain “lomo” is the tenderloin. In Colombia you must say which: lomo fino (tenderloin) or lomo ancho (strip loin). In Spain beef “lomo” is the strip loin and the tenderloin is “solomillo”. In Peru, the “lomo” in lomo saltado is tenderloin.', 'Na Argentina “lomo” sozinho é o filé mignon. Na Colômbia é preciso dizer qual: lomo fino (filé mignon) ou lomo ancho (contrafilé). Na Espanha o “lomo” bovino é o contrafilé, e o filé mignon chama-se solomillo.'] },
  { id: 'solomo', g: 'trap', cut: 'la', t: ['Solomillo, solomo, solomito', 'Solomillo, solomo, solomito', 'Solomillo, solomo, solomito'], aka: ['', '', ''],
    d: ['Parecen la misma palabra y no lo son. Solomillo (España) y solomito (Antioquia, Colombia) son el lomo fino. Solomo (Venezuela) es el lomo ancho: «solomo de cuerito» es el bife con su grasa.', 'They look like one word and are not. Solomillo (Spain) and solomito (Antioquia, Colombia) are the tenderloin. Solomo (Venezuela) is the strip loin: “solomo de cuerito” is strip steak with its fat on.', 'Parecem a mesma palavra e não são. Solomillo (Espanha) e solomito (Antioquia, Colômbia) são o filé mignon. Solomo (Venezuela) é o contrafilé: “solomo de cuerito” é o bife com sua gordura.'] },
  { id: 'bife', g: 'trap', cut: 'ba', t: ['Bife', 'Bife', 'Bife'], aka: ['', '', ''],
    d: ['En Argentina un bife es un filete grueso para la parrilla, y además nombra cortes: bife de chorizo (lomo ancho), bife ancho (ojo de bife). En Brasil y Portugal un «bife» es cualquier filete delgado de sartén. El bife de chorizo no tiene chorizo.', 'In Argentina a bife is a thick grilling steak, and it also names cuts: bife de chorizo (strip loin), bife ancho (ribeye). In Brazil and Portugal a “bife” is any thin pan steak. Bife de chorizo contains no chorizo.', 'Na Argentina um bife é um filé grosso para a grelha, e também dá nome a cortes: bife de chorizo (contrafilé), bife ancho (ancho). No Brasil e em Portugal “bife” é qualquer fatia fina de frigideira. O bife de chorizo não leva chouriço.'] },
  { id: 'mechar', g: 'trap', cut: 'sb', t: ['Mechar y desmechar', 'Mechar and desmechar', 'Mechar e desmechar'], aka: ['deshebrar · deshilachar', 'lard · shred', 'lardear · desfiar'],
    d: ['Mechar es meterle a la pieza tiras de tocino o verduras antes de cocinarla. Desmechar es lo contrario: deshacer la carne cocida en hebras. Lo mismo se dice deshebrar (México), deshilachar (Chile, Argentina) y desfiar (Brasil).', '“Mechar” is to lard: push strips of bacon or vegetables into the piece before cooking. “Desmechar” is the opposite: pulling cooked meat into shreds. The same idea is deshebrar (Mexico), deshilachar (Chile, Argentina) and desfiar (Brazil).', '“Mechar” é lardear: enfiar tiras de toucinho ou legumes na peça antes de cozinhar. “Desmechar” é o contrário: desfiar a carne cozida. O mesmo se diz deshebrar (México), deshilachar (Chile, Argentina) e desfiar (Brasil).'] },
  { id: 'tocino', g: 'trap', cut: 'ppn', t: ['Tocino, tocineta, panceta, bacon', 'Tocino, tocineta, panceta, bacon', 'Tocino, tocineta, panceta, bacon'], aka: ['', '', 'toucinho'],
    d: ['En Colombia «tocino» es la barriga fresca con piel (la del chicharrón) y «tocineta» es la curada y ahumada en lonjas. En México «tocino» ya es el ahumado. En España «tocino» es solo la grasa, y la barriga es «panceta». En Italia la pancetta es curada, no fresca.', 'In Colombia “tocino” is fresh skin-on belly (the chicharrón cut) and “tocineta” is the cured, smoked, sliced kind. In Mexico “tocino” already means smoked bacon. In Spain “tocino” is just the fat, and the belly is “panceta”. In Italy pancetta is cured, not fresh.', 'Na Colômbia “tocino” é a barriga fresca com pele (a do torresmo) e “tocineta” é a curada e defumada em fatias. No México “tocino” já é o bacon. Na Espanha “tocino” é só a gordura, e a barriga é “panceta”. No Brasil “toucinho” é a gordura com pele; na Itália a pancetta é curada, não fresca.'] },
  { id: 'pernil', g: 'trap', cut: 'ppi', t: ['Pernil', 'Pernil', 'Pernil'], aka: ['', '', ''],
    d: ['En Colombia, Venezuela, Argentina y Brasil es la pierna trasera. En Puerto Rico el pernil asado suele ser paleta. En Chile «pernil» es el codillo: si pides pernil para hornear te llevas otra cosa.', 'In Colombia, Venezuela, Argentina and Brazil it is the hind leg. In Puerto Rico roast pernil is usually shoulder. In Chile “pernil” is the hock: ask for one to roast and you get something else.', 'Na Colômbia, na Venezuela, na Argentina e no Brasil é a perna traseira. Em Porto Rico o pernil assado costuma ser paleta. No Chile “pernil” é o joelho: quem pede pernil para assar leva outra coisa.'] },
  { id: 'chicharron', g: 'trap', cut: 'pcu', t: ['Chicharrón', 'Chicharrón', 'Chicharrón / Torresmo'], aka: ['', '', ''],
    d: ['En Colombia y Centroamérica es barriga con carne, frita. En México puede ser solo el cuero inflado, o el «prensado» de recortes. En Perú y Bolivia es costilla o paleta frita en trozos. En España, según la región, son torreznos o una carne prensada.', 'In Colombia and Central America it is meaty fried belly. In Mexico it can be just the puffed skin, or “prensado”, pressed trimmings. In Peru and Bolivia it is fried chunks of rib or shoulder. In Spain, depending on the region, it is torreznos or a pressed meat.', 'Na Colômbia e na América Central é barriga com carne, frita. No México pode ser só a pele estufada, ou o “prensado” de aparas. No Peru e na Bolívia é costela ou paleta frita em pedaços. No Brasil o equivalente é o torresmo.'] },
  { id: 'butt', g: 'trap', cut: 'pbo', t: ['Pork butt', 'Pork butt', 'Pork butt'], aka: ['Boston butt', 'Boston butt', 'Boston butt'],
    d: ['No es la parte de atrás: «butt» es la parte alta de la paleta, la cabeza de lomo. El nombre viene de los barriles («butts») en que se empacaba en Boston. La pierna trasera es «ham».', 'It is not the rear end: the butt is the top of the shoulder. The name comes from the barrels (“butts”) it was packed in around Boston. The hind leg is the ham.', 'Não é a parte de trás: “butt” é a parte alta da paleta, a copa lombo. O nome vem dos barris (“butts”) em que era embalada em Boston. A perna traseira é “ham”.'] },
  { id: 'iberico', g: 'grade', cut: 'pse', t: ['Ibérico y bellota', 'Ibérico and bellota', 'Ibérico e bellota'], aka: ['pata negra', 'pata negra', 'pata negra'],
    d: ['Ibérico es la raza, de la península ibérica, que infiltra grasa en el músculo como ninguna otra. «De bellota» dice qué comió: bellotas en la dehesa durante la montanera. «De cebo» es ibérico criado con pienso. Secreto, presa y pluma son cortes propios de su despiece.', 'Ibérico is the breed, from the Iberian peninsula, which marbles like no other pig. “De bellota” says what it ate: acorns on the dehesa in the final months. “De cebo” is Ibérico raised on feed. Secreto, presa and pluma are cuts from its own butchery tradition.', 'Ibérico é a raça, da península ibérica, que entremeia gordura no músculo como nenhuma outra. “De bellota” diz o que comeu: bolotas no montado nos últimos meses. “De cebo” é ibérico criado com ração. Secreto, presa e pluma são cortes próprios do seu desmanche.'] },
  { id: 'chuleta', g: 'trap', t: ['Chuleta y chuletón', 'Chuleta and chuletón', 'Chuleta e chuletón'], aka: ['', '', ''],
    d: ['En España el chuletón es el lomo ancho con su hueso, muy grueso. En Colombia una «chuleta» suele ser un filete apanado (la chuleta valluna es de cerdo). En Venezuela y México la chuleta es de costillar, casi siempre de cerdo.', 'In Spain a chuletón is a very thick bone-in rib steak. In Colombia a “chuleta” is usually a breaded cutlet (chuleta valluna is pork). In Venezuela and Mexico a chuleta is a rib chop, almost always pork.', 'Na Espanha o chuletón é a costela do contrafilé com osso, bem grossa. Na Colômbia uma “chuleta” costuma ser um bife à milanesa (a chuleta valluna é de porco). Na Venezuela e no México a chuleta é da costela, quase sempre de porco.'] }
];

  },
  cuts: {
    lf: { d: 'O músculo que menos trabalha do boi: fica por dentro, sob a coluna, e quase não carrega peso. Por isso é o mais macio e também o de sabor mais suave.', tip: 'Procure uma peça limpa, sem o cordão lateral. Rende uns 180 g por pessoa.', cook: '52–57 °C por dentro. Passado do ponto perde sua única vantagem.',
      why: { sear: 'Quase não tem colágeno nem gordura, então basta uma selagem forte e curta; a manteiga ou o bacon dão a gordura que lhe falta.', roast: 'Seu formato cilíndrico e regular assa por igual de ponta a ponta, ideal para Wellington ou Chateaubriand.', raw: 'É a fibra mais fina e sem nervos do boi: desmancha na boca mesmo sem cozimento, por isso é o corte do tartar e do carpaccio.', stirfry: 'Macio até em tiras grossas: não precisa de marinada e aguenta o fogo alto de um lomo saltado ou de um estrogonofe.' } },
    la: { d: 'O músculo longo do lombo, por cima do filé mignon. Macio, de fibra compacta e com uma borda de gordura que o rega enquanto assa.', tip: 'Procure gordura branca e firme na borda e veios finos por dentro. Não deixe tirarem toda a gordura.', cook: '54–60 °C por dentro; descanse 5 minutos antes de cortar.',
      why: { grill: 'É macio sem ajuda e sua borda de gordura derrete sobre a brasa: o equilíbrio clássico entre sabor e maciez.', sear: 'A fibra compacta forma uma crosta uniforme e o interior fica rosado sem esforço.', roast: 'Inteiro e com a capa de gordura para cima é o rosbife por excelência: corta-se em fatias limpas.' } },
    ba: { d: 'A parte do lombo que fica dentro do costilhar. É o corte mais marmorizado: a capa (spinalis) que rodeia o olho é para muitos o melhor bocado do boi.', tip: 'Escolha o que tiver mais veios finos de gordura e uma capa generosa. Com osso demora mais, mas fica mais suculento.', cook: '55–60 °C: precisa chegar ao ponto para a gordura derreter.',
      why: { grill: 'A gordura entremeada derrete e o rega por dentro: é o corte que mais perdoa um minuto a mais.', sear: 'Tanta gordura intramuscular dá uma crosta profunda e um interior suculento só com sal.', roast: 'Inteiro e com osso é o prime rib: o osso e a gordura o protegem durante o forno lento.', slice: 'Em fatias, seus veios de gordura derretem em segundos: por isso é o corte do sukiyaki, do shabu-shabu e do bulgogi.' } },
    tb: { d: 'Dois cortes em um, unidos pelo osso em T: de um lado contrafilé, do outro filé mignon. Se a parte do filé é grande chama-se porterhouse.', tip: 'Peça com pelo menos 4 cm de espessura; fino, o lado do filé passa do ponto antes do outro.', cook: '52–57 °C. Deixe o lado do filé longe do fogo mais forte.',
      why: { grill: 'O osso freia o cozimento junto dele e deixa a carne mais suculenta; grosso e na brasa é a bistecca alla fiorentina.' } },
    ca: { d: 'O grande músculo da alcatra. Trabalha mais que o lombo, então é menos macio, mas tem mais sabor e custa menos.', tip: 'Peça o centro (miolo), que é a parte mais regular e macia.', cook: '55–60 °C; além disso fica firme. Corte contra a fibra.',
      why: { grill: 'Magra mas saborosa: bom bife de grelha pela metade do preço do lombo, desde que não passe do ponto.', skewer: 'Aguenta o cubo sem desmanchar e tem sabor suficiente para uma marinada forte: é a carne do espetinho e do shish kebab.', stirfry: 'Fibra curta e pouca gordura: em tiras contra a fibra fica macia em um minuto de wok.' } },
    pa: { d: 'Um triângulo que cobre a alcatra, com uma capa grossa de gordura. Na Colômbia fatia-se ao comprido; cortada na largura em bifes grossos é a picanha brasileira.', tip: 'Uma boa picanha pesa entre 1 e 1,5 kg; maior já inclui parte do coxão duro. Não deixe tirarem a gordura.', cook: '54–58 °C. Comece pelo lado da gordura em fogo médio.',
      why: { grill: 'Sua capa de gordura de mais de um centímetro derrete e a rega enquanto doura: por isso assa-se inteira ou em meias-luas, com a gordura.', roast: 'Com a gordura para cima ela se rega sozinha no forno e fica rosada de lado a lado.', skewer: 'Dobrada em C no espeto, com a gordura por fora: assim se faz no rodízio.' } },
    co: { d: 'Peça triangular na parte baixa da alcatra. Suculenta e de bom sabor, com a fibra que muda de direção no meio da peça.', tip: 'Repare para onde corre a fibra em cada metade: fatia-se em duas direções diferentes.', cook: '54–58 °C, inteira, e fatiada fina contra a fibra.',
      why: { grill: 'Assa-se inteira, selada e depois em fogo indireto: fica suculenta por dentro com pouca perda.', smoke: 'É o corte do churrasco estilo Santa Maria: uma hora de fumaça de lenha e fatia-se como um brisket pequeno.' } },
    sb: { d: 'O músculo plano do abdômen: largo, de fibra longa e grossa que corre ao comprido. Muito sabor e pouca gordura.', tip: 'Para desfiar peça inteiro; para a grelha, de espessura regular. Sempre se fatia contra a fibra.', cook: 'Na grelha: fogo alto e não mais de 57 °C. Na panela: 2–3 horas até desmanchar.',
      why: { shred: 'Suas fibras longas e paralelas se separam em fios perfeitos: é a carne da ropa vieja e da carne desfiada.', braise: 'Cozido devagar em molho, o colágeno entre as fibras vira gelatina e a peça fica macia sem desmanchar.', grill: 'Marinado, em fogo muito alto e fatiado fino contra a fibra: assim uma carne fibrosa fica macia.', stirfry: 'Em tiras contra a fibra absorve a marinada e fica macio: é a carne clássica do beef and broccoli.', roll: 'Plano e largo, abre-se, recheia-se e enrola-se com facilidade: braciole, matambre, sobrebarriga recheada.' } },
    va: { d: 'O flanco entre as costelas e a alcatra. Fibra grossa e solta, com uma membrana de gordura por fora: suculenta e de sabor intenso.', tip: 'Deixe a membrana externa: fica crocante e protege a carne.', cook: 'Inteira em fogo médio 40–50 min, ou em bifes em fogo alto. 55–60 °C.',
      why: { grill: 'Inteira e devagar, a gordura externa doura e o interior fica suculento: é um dos cortes centrais do asado argentino.', stirfry: 'Sua fibra aberta segura a marinada: por isso é a carne da carne asada das taquerias e de muitos salteados.' } },
    en: { d: 'O diafragma: uma tira longa e fina por dentro das costelas. Fibra muito marcada que corre na largura e sabor intenso, quase de fígado.', tip: 'Peça com a membrana se quiser crocante ao estilo argentino, ou limpa para tacos e fajitas.', cook: 'Fogo muito alto, 2–3 minutos por lado. Corte em pedaços e depois contra a fibra.',
      why: { grill: 'Fina e com gordura entre as fibras: doura por fora antes de ressecar por dentro. É das carnes com mais sabor na grelha.', stirfry: 'É a carne original das fajitas: fibra aberta que pega a marinada e se corta em tiras contra a fibra.' } },
    ha: { d: 'Fica pendurado no diafragma junto aos rins e só há um por boi. Dois lóbulos unidos por um nervo central; sabor profundo, de ferro.', tip: 'Peça para tirarem o nervo do centro: ficam duas tiras prontas para a frigideira.', cook: 'Fogo alto e não mais de 55 °C: bem passado fica duro.',

    ma: { d: 'Uma manta fina entre o couro e as costelas, o músculo com que o boi espanta as moscas. Larga, fina e com gordura de um lado.', tip: 'Para enrolar peça inteiro e regular; para a grelha, amaciado ou fervido antes em leite.', cook: 'Enrolado: fervido 2 horas. Na grelha: devagar, 40 minutos, ou pré-cozido.',
      why: { roll: 'É uma manta natural: cobre-se de recheio, enrola-se e amarra-se. Assim nasce o matambre arrollado.', braise: 'Confitado devagar na própria gordura fica macio: é o suadero dos tacos da Cidade do México.' } },
    fa: { d: 'A parte baixa do costilhar, sob as costelas. Camadas alternadas de carne e gordura, com fibra longa.', tip: 'Para desfiar peça a parte mais carnuda; a mais gorda serve para moer ou para caldo.', cook: '2–3 horas na panela, 45 minutos na panela de pressão.',
      why: { shred: 'Fibra longa com gordura entre as camadas: desfia fácil e não fica seca. É a carne das empanadas e da carne en polvo.', soup: 'A gordura e o tecido entre as camadas dão corpo ao caldo, e a carne fica macia para servir na sopa.', cure: 'É o corte do pastrami clássico e do bacon bovino: aguenta a salmoura e a fumaça sem ressecar graças à gordura.' } },
    cs: { d: 'Costelas com sua carne: osso, gordura e músculo em camadas. Muito colágeno, muita gordura e o sabor mais intenso do boi.', tip: 'Para caldo, em pedaços com osso. Para grelha, em tira de 2 cm cortada através do osso. Para forno, blocos de 8 cm.', cook: 'Ensopada: 3 horas até 93 °C. Em tira na grelha: fogo médio, 40 minutos.',
      why: { braise: 'Tem tanto colágeno que, depois de três horas, o molho engrossa sozinho e a carne solta do osso.', soup: 'Osso, tutano e gordura no mesmo pedaço: por isso o caldo de costela tem tanto sabor com tão poucos ingredientes.', smoke: 'Seis a oito horas de fumaça derretem sua gordura e seu colágeno: são as “dino ribs” do churrasco texano.', grill: 'Cortada em tira fina através do osso cozinha antes de endurecer: asado de tira argentino ou galbi coreano.' } },
    pe: { d: 'Os peitorais sustentam mais da metade do peso do boi, por isso têm muitíssimo colágeno. Dois músculos: o plano (magro) e a ponta (gorda).', tip: 'Para defumar peça inteiro, com plano e ponta, e com meio centímetro de gordura por cima.', cook: 'Longo e lento até 93–96 °C por dentro; depois descanso de uma hora.',
      why: { smoke: 'É o corte emblemático do defumado: 10–14 horas transformam seu colágeno em gelatina e a capa de gordura o protege todo esse tempo.', braise: 'Com cozimento úmido e lento fica macio e suculento; corta-se em fatias que não desmancham.', cure: 'Aguenta dias de salmoura: daqui saem o corned beef e o pastrami.', soup: 'Sua gordura e seu colágeno dão um caldo com corpo: é a carne do pho, do puchero e do cozido.' } },
    ag: { d: 'A continuação do ancho em direção ao pescoço: vários músculos unidos por veios de gordura e colágeno. Dos cortes com mais sabor do boi.', tip: 'Para moer é a melhor peça sozinha: traz cerca de 20 % de gordura. Para ensopar, em pedaços grandes.', cook: 'Ensopado: 2,5–3 horas. Em bife fino: fogo alto e rápido.',
      why: { braise: 'Seus veios de gordura e colágeno derretem na panela: dá o ensopado mais suculento e o molho com mais corpo.', grind: 'Traz naturalmente a proporção 80/20 de carne e gordura, e muito sabor: é a base de um bom hambúrguer.', shred: 'Depois de três horas desmancha em fios grossos e suculentos: a carne da barbacoa, da birria e do pot roast.', smoke: 'Defumado como um brisket pequeno fica tão suculento quanto, na metade do tempo: pulled beef.' } },
    pl: { d: 'O ombro do boi: magro, de vários músculos. Um deles, o que fica sobre a paleta (flat iron), é dos mais macios do animal.', tip: 'Para bife peça a parte plana de cima da paleta; o resto, em pedaços para ensopar.', cook: 'Ensopado: 2 horas. Flat iron: frigideira quente até 55 °C.',
      why: { braise: 'Magra mas com colágeno suficiente: dá um ensopado de pedaços inteiros e firmes que não desmancham, a bom preço.', sear: 'O músculo infraespinhal (flat iron) está entre os mais macios segundo as medições de corte: um bife fino a preço de carne de panela.' } },
    ps: { d: 'O pescoço se mexe o dia todo: é duro, cheio de colágeno e de sabor profundo. Dos mais baratos e rendosos para a panela.', tip: 'Com osso para caldo; sem osso e em pedaços para ensopados longos ou para moer.', cook: '3 horas em fogo baixo, ou 50 minutos na panela de pressão.',

    mo: { d: 'A giba do gado zebu, a raça mais comum no Brasil e na Colômbia. Gordura entremeada com carne de fibra longa: duro se apressado, amanteigado se lhe dão tempo.', tip: 'Só existe em gado zebu. Peça inteiro, de 1 a 2 kg, para assar devagar.', cook: 'Embrulhado e lento: 4–5 horas a 150 °C, ou primeiro na panela de pressão e depois na brasa.',
